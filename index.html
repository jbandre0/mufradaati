function renderSentenceRow(s,idx){
  // Build the Arabic line with highlighted tokens
  const arHtml=s.words.map(w=>{
    if(w.isNew){
      const safeM=w.meaning.replace(/'/g,"&#39;").replace(/"/g,"&quot;");
      const wId=`w-${idx}-${Math.random().toString(36).slice(2,5)}`;
      return`<span class="w-new" id="${wId}" onclick="showWordPopup('${wId}','${safeM}','${encodeURIComponent(w.token)}')">${w.token}</span>`;
    }
    return`<span class="w-known">${w.token}</span>`;
  }).join(" ");
  return`<div class="sentence-row">
    <div class="sentence-ar">${arHtml}</div>
    ${s.en?`<div class="sentence-en">${s.en}</div>`:""}
  </div>`;
}

function showWordPopup(elId,meaning,encodedToken){
  // Remove any existing popup
  document.querySelectorAll(".w-popup").forEach(el=>el.remove());
  const trigger=document.getElementById(elId);if(!trigger)return;
  const token=decodeURIComponent(encodedToken);
  const popup=document.createElement("div");
  popup.className="w-popup";
  popup.style.cssText=`position:fixed;z-index:300;background:var(--card);border:1px solid rgba(127,214,200,0.3);border-radius:12px;padding:14px 16px;min-width:200px;max-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center;`;
  popup.innerHTML=`
    <div style="font-family:'Amiri',serif;font-size:22px;color:var(--goldL);direction:rtl;margin-bottom:4px">${token}</div>
    <div style="font-size:14px;color:var(--sand);margin-bottom:12px;font-family:'Philosopher',serif">${meaning}</div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
      <button onclick="addWordFromApply('${encodeURIComponent(token)}','${meaning.replace(/'/g,"&#39;")}','mastered')" style="font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--green);color:var(--green);background:rgba(95,211,160,0.08);cursor:pointer;font-family:inherit">✓ Add to Mastered</button>
      <button onclick="addWordFromApply('${encodeURIComponent(token)}','${meaning.replace(/'/g,"&#39;")}','l1q')" style="font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--blue);color:var(--blue);background:rgba(127,214,200,0.08);cursor:pointer;font-family:inherit">+ Add to L1 Queue</button>
    </div>
    <div style="font-size:10px;color:var(--muted2);margin-top:8px">or tap elsewhere to close</div>`;
  // Position near trigger
  const rect=trigger.getBoundingClientRect();
  const top=rect.top-160>0?rect.top-150:rect.bottom+8;
  popup.style.top=top+"px";
  popup.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-270))+"px";
  document.body.appendChild(popup);
  // Click outside to close
  setTimeout(()=>document.addEventListener("click",function h(e){if(!popup.contains(e.target)&&e.target.id!==elId){popup.remove();document.removeEventListener("click",h);}},true),100);
}

function addWordFromApply(encodedToken,meaning,targetBox){
  const token=decodeURIComponent(encodedToken);
  // Check if already in system
  const existing=getWords().find(w=>w.arabic===token);
  if(existing){
    // Just move to target box if not already there
    const boxes=getBoxes();
    const alreadyThere=(boxes[targetBox]||[]).includes(existing.id);
    if(!alreadyThere){
      // Remove from current boxes
      Object.keys(boxes).forEach(k=>boxes[k]=(boxes[k]||[]).filter(x=>x!==existing.id));
      boxes[targetBox]=[...(boxes[targetBox]||[]),existing.id];
      saveBoxes(boxes);
      toast(`"${token}" moved to ${boxDef(targetBox).label} ✓`);
    }else{
      toast(`Already in ${boxDef(targetBox).label}`,"var(--muted)");
    }
  }else{
    // Create new word
    const word={id:uid(),arabic:token,english:meaning,example:"",wordType:"Other",dialect:_applyState.dialect,forms:{},createdAt:Date.now()};
    saveWords([...getWords(),word]);
    addWordToBox(word.id,targetBox);
    toast(`"${token}" added to ${boxDef(targetBox).label} ✓`);
  }
  document.querySelectorAll(".w-popup").forEach(el=>el.remove());
}

async function generateApply(){
  const masteredIds=(getBoxes().mastered||[]);
  const masteredWords=masteredIds.map(id=>wordById(id)).filter(Boolean);
  const allWords=getWords();
  const wordPool=masteredWords.length>0?masteredWords:allWords;
  if(!wordPool.length){toast("No words in system yet","var(--red)");return;}

  _applyState={..._applyState,loading:true,result:null,error:null};render();

  const dialect=_applyState.dialect;
  const dialectNote=DIALECT_NOTES[dialect]||dialect;
  const mode=_applyState.mode;

  // Build word bank — keep it under ~40 words to avoid prompt bloat
  const wordBank=wordPool.slice(0,40).map(w=>{
    let entry=w.arabic+" ("+w.english+", "+w.wordType+")";
    if(w.forms&&Object.keys(w.forms).length>0){
      const formStr=Object.entries(w.forms).map(function(kv){return kv[0]+": "+kv[1];}).join(", ");
      entry+=" ["+formStr+"]";
    }
    return entry;
  }).join("\n");

  let prompt="";

  if(mode==="reading"){
    prompt=`You are an expert Arabic language teacher specializing in ${dialectNote}.

The student has mastered these Arabic words:
${wordBank}

Task: Write a natural, flowing paragraph (5–7 sentences) in ${dialectNote} with FULL diacritics on every word. The paragraph should:
- Use as many of the mastered words as possible in natural context
- Have a coherent topic (daily life, a story, a scene, etc.)
- Be at a slightly challenging but readable level
- Feel authentic to the dialect, not like a textbook

Then return a word-by-word analysis so new words can be highlighted.

CRITICAL: Respond ONLY with valid JSON, no markdown:
{
  "sentences": [
    {
      "ar": "full Arabic sentence with diacritics",
      "en": "English translation",
      "words": [
        {"token": "each Arabic word WITH diacritics exactly as it appears", "meaning": "English meaning", "isNew": true or false}
      ]
    }
  ]
}

For "isNew": mark as false if the word (or its root/base form) is in the mastered list above. Mark as true if it is genuinely new vocabulary the student hasn't seen. Function words (و، في، على، من، إلى، هو، هي، ال etc.) should be marked isNew: false since they are basic grammar.`;
  } else {
    // Grammar mode
    const focus=GRAMMAR_FOCUSES.find(f=>f.id===_applyState.grammarFocus)||GRAMMAR_FOCUSES[0];
    const structureInstructions={
      "past-simple":"Write 6 sentences using past tense verbs (فعل ماضٍ). Vary the subject (أنا، أنت، هو، هي، نحن، هم). Use mastered vocabulary as objects or context.",
      "present-simple":"Write 6 sentences using present/imperfect tense (فعل مضارع). Vary subjects. Show the full conjugation range.",
      "future":"Write 6 sentences about the future using سَـ / سَوْفَ (MSA) or appropriate dialect equivalents. Vary subjects and contexts.",
      "imperative":"Write 6 imperative sentences (أوامر). Vary between masculine singular, feminine singular, and plural. Include both positive and negative imperatives.",
      "negation-maa":"Write 6 sentences using ما or لا for negation. Show different negation patterns — negating verbs, nouns, adjectives.",
      "negation-lam":"Write 6 sentences using لَمْ (negates present used as past) and لَنْ (negates future). Demonstrate the jussive/subjunctive mood they require.",
      "idaafa":"Write 6 sentences showcasing the idaafa (إضافة) construct — two or more nouns in a genitive relationship. Show both definite and indefinite idaafa.",
      "accusative":"Write 6 sentences clearly demonstrating the accusative case (المفعول به / المنصوب). Include direct objects, circumstantial accusatives (حال), and accusative of specification (تمييز) where natural.",
      "genitive":"Write 6 sentences demonstrating the genitive case (المجرور) after prepositions (في، على، من، إلى، بـ، لـ، عن، مع). Vary the prepositions.",
      "dual":"Write 6 sentences using dual forms (المثنى) for nouns, adjectives, and verbs. Show both nominative and oblique dual endings.",
      "broken-plural":"Write 6 sentences that naturally include nouns or adjectives with broken plurals (جمع التكسير). Vary the patterns (فُعُول، أَفْعَال، فِعَال، فُعَلاء etc.).",
      "verb-agreement":"Write 6 sentences showing verb–subject agreement rules: verb before subject (singular verb), verb after subject (fully inflected). Include both masculine and feminine subjects.",
      "relative-clause":"Write 6 sentences using relative clauses with الذي، التي، الذين، اللواتي (MSA) or dialect equivalents. Include both definite and indefinite antecedents.",
      "conditional":"Write 6 conditional sentences using لَوْ (unreal/past) and إِذَا (real/future). Show the correct mood in both clauses. Include 3 with لو and 3 with إذا.",
      "passive":"Write 6 sentences in the passive voice (المبني للمجهول). Vary tenses (past and present passive). Show how the voweling changes from active.",
      "comparative":"Write 6 sentences using comparative (أَفْعَل) and superlative forms. Include elative forms and comparisons with من.",
    }[focus.id]||"Write 6 varied sentences demonstrating this grammar concept.";

    prompt=`You are an expert Arabic language teacher specializing in ${dialectNote}.

The student has mastered these Arabic words:
${wordBank}

Grammar focus: ${focus.label} (${focus.desc})

Task: ${structureInstructions}

Use mastered vocabulary where natural. Add other vocabulary as needed. FULL diacritics on every single Arabic word — this is essential for the student to learn pronunciation.

Start your response with a 1–2 sentence plain-English explanation of the grammatical concept and what to notice in the sentences.

CRITICAL: Respond ONLY with valid JSON, no markdown:
{
  "explanation": "Brief English explanation of the grammar concept and what to watch for",
  "sentences": [
    {
      "ar": "Arabic sentence with FULL diacritics",
      "en": "English translation",
      "words": [
        {"token": "each Arabic word with diacritics", "meaning": "English meaning", "isNew": true or false}
      ]
    }
  ]
}

For "isNew": false = in mastered list or is a basic function word. true = genuinely new vocabulary.`;
  }

  try{
    const resp=await fetch(apiUrl(),{
      method:"POST",
      headers:apiHeaders(),
      body:JSON.stringify({
        model:"claude-sonnet-4-5-20250929",
        max_tokens:4000,
        system:"You are an expert Arabic language teacher. Always respond with valid JSON only — no markdown fences, no explanation outside the JSON, no preamble.",
        messages:[{role:"user",content:prompt}]
      })
    });
    const data=await resp.json();
    if(data.error){
      _applyState={..._applyState,loading:false,error:`API error (${data.error.type}): ${data.error.message}`};
      render();return;
    }
    const raw=data.content?.find(c=>c.type==="text")?.text||"";
    if(!raw){
      _applyState={..._applyState,loading:false,error:`Empty response from API. Full: ${JSON.stringify(data).slice(0,200)}`};
      render();return;
    }
    // Strip any markdown fences robustly
    const jsonMatch=raw.match(/\{[\s\S]*\}/);
    if(!jsonMatch){
      _applyState={..._applyState,loading:false,error:`No JSON found in response: ${raw.slice(0,200)}`};
      render();return;
    }
    let parsed;
    try{parsed=JSON.parse(jsonMatch[0]);}
    catch(je){_applyState={..._applyState,loading:false,error:`JSON parse error: ${je.message}. Text: ${raw.slice(0,200)}`};render();return;}
    _applyState={..._applyState,loading:false,result:parsed};
  }catch(e){
    _applyState={..._applyState,loading:false,error:`Fetch failed: ${e.message||String(e)}`};
  }
  render();
}

          <button class="btn1" onclick="checkProxyAndContinue()">&#10003; Check Connection</button>

          Each user has their own PIN (separates your words) and their own Anthropic API key (separates billing).<br/>
          Nothing is shared between users.
        </div>
      </div>
    </div>`;
}
async function checkProxyAndContinue(){
  const el=document.getElementById("proxy-check-result");
  el.style.color="var(--muted)";el.textContent="Checking…";
  try{
    const r=await fetch(WORKER_URL,{method:"GET"});
    if(r.status===405||r.status===200){
      sessionStorage.setItem("muf-proxy-ok","1");
      el.style.color="var(--green)";el.textContent="✓ Connected!";
      setTimeout(()=>{
        if(!getPin())renderPinScreen();
        else bootApp();
      },800);
    }else{throw new Error(`Unexpected status ${r.status}`);}
  }catch(e){
    el.style.color="var(--red)";
    el.textContent="✗ Can't reach Cloudflare Worker — check that it's deployed correctly.";
  }
}
function skipApiKey(){
  sessionStorage.setItem("muf-skip-key","1");
  bootApp();
}

function submitPin(skipKey){
  const pin=(document.getElementById("pin-input")?.value||"").trim();
  const key=(document.getElementById("apikey-input")?.value||"").trim();
  const errEl=document.getElementById("pin-error");
  if(pin.length<4){errEl.style.display="block";errEl.textContent="PIN must be at least 4 digits";return;}
  if(!skipKey&&key&&!key.startsWith("sk-ant")){errEl.style.display="block";errEl.textContent="Invalid API key format — should start with sk-ant";return;}
  errEl.style.display="none";
  savePin(pin);
  if(!skipKey&&key)saveApiKey(key);
  bootApp();
}
async function bootApp(){
  if(!insideClaude()){
    const justImported=sessionStorage.getItem("muf-just-imported");
    sessionStorage.removeItem("muf-just-imported");
    if(!justImported){
      // Normal boot: pull latest data from KV
      setSyncStatus("↓ loading…","var(--muted)");
      const remote=await kvGetAll();
      if(remote){
        const keys=["muf-words","muf-boxes","muf-settings","muf-stats","muf-last-clear"];
        keys.forEach(k=>{const pk=pinKey(k);if(remote[pk]!==undefined)localStorage.setItem(pk,remote[pk]);});
        setSyncStatus("✓ synced","var(--green)");
      } else {setSyncStatus("","var(--muted)");}
    }
    // If justImported: localStorage already has fresh data — skip KV fetch to avoid overwrite
  }
  runMidnightClear();
  const sess=getSession();
  if(sess&&sess.active)_view="review";
  render();
}

(function init(){

})();

// MASTERED REVIEW
// ═══════════════════════════════════════════════════════════
function getMasteredStars(){return ls("muf-mastered-stars",{});}
function saveMasteredStars(s){ss("muf-mastered-stars",s);kvSet("muf-mastered-stars",s).catch(()=>{});}

let _masteredSess=null;
let _masteredModalCount=25;
let _masteredModalDir="ar-en";

function openMasteredModal(){
  const boxes=getBoxes();
  const masteredIds=boxes.mastered||[];
  if(!masteredIds.length){toast("No mastered words yet","var(--muted)");return;}
  const stars=getMasteredStars();
  const total=masteredIds.length;
  const unquizzed=masteredIds.filter(id=>!stars[id]).length;
  // clamp count to available
  if(_masteredModalCount>total)_masteredModalCount=total;
  const presets=[10,25,50,100].filter(c=>c<total);
  const countBtns=[...presets,total].map(c=>{
    const active=_masteredModalCount===c;
    return`<button onclick="_masteredModalCount=${c};openMasteredModal()"
      style="flex:1;padding:10px;border-radius:8px;border:1.5px solid ${active?"var(--gold)":"var(--border)"};
        background:${active?"rgba(217,180,94,0.1)":"transparent"};cursor:pointer;font-size:13px;
        font-weight:${active?"700":"400"};color:${active?"var(--goldL)":"var(--muted)"};
        font-family:inherit;transition:all .2s">${c===total?"All "+total:c}</button>`;
  }).join("");
  document.getElementById("modal-root").innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div style="font-size:10px;color:var(--lm);letter-spacing:.15em;text-transform:uppercase;margin-bottom:5px">Bonus Session</div>
        <div style="font-size:22px;font-weight:700;color:var(--goldL);margin-bottom:6px">★ Mastered Review</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:22px">${total} mastered words · <span style="color:var(--goldL)">${unquizzed} not yet quizzed</span> (prioritised)</div>
        ${sHead("How many words?")}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px">${countBtns}</div>
        <div style="padding-top:16px;border-top:1px solid var(--border)">
          <div style="font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px">Card Direction</div>
          <div style="display:flex;gap:0;border:1px solid var(--border);border-radius:9px;overflow:hidden">
            <button onclick="_masteredModalDir='ar-en';openMasteredModal()"
              style="flex:1;padding:9px 8px;border:none;cursor:pointer;font-size:12px;letter-spacing:.04em;transition:all .2s;font-family:inherit;
                ${_masteredModalDir==="ar-en"?"background:rgba(217,180,94,0.12);color:var(--goldL);font-weight:600":"background:transparent;color:var(--muted)"}">
              Arabic → English</button>
            <button onclick="_masteredModalDir='en-ar';openMasteredModal()"
              style="flex:1;padding:9px 8px;border:none;border-left:1px solid var(--border);cursor:pointer;font-size:12px;letter-spacing:.04em;transition:all .2s;font-family:inherit;
                ${_masteredModalDir==="en-ar"?"background:rgba(217,180,94,0.12);color:var(--goldL);font-weight:600":"background:transparent;color:var(--muted)"}">
              English → Arabic</button>
          </div>
          <div style="font-size:10px;color:var(--muted2);margin-top:6px">${_masteredModalDir==="ar-en"?"See Arabic, recall English meaning":"See English, recall Arabic word &amp; forms"}</div>
        </div>
        <div style="font-size:11px;color:var(--muted);background:rgba(217,180,94,0.05);border:1px solid rgba(217,180,94,0.15);border-radius:8px;padding:10px 12px;margin-top:16px;line-height:1.65">
          Words earn <strong style="color:var(--goldL)">★ stars</strong> (1–5) as you get them right. Wrong answers lose a star. Two wrong answers in a row at 0 stars will drop the word back into L5B.
        </div>
        <div style="display:flex;gap:10px;margin-top:22px">
          <button class="btn1" onclick="startMasteredSession()">Begin ★</button>
          <button class="btn3" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>`;
}

function startMasteredSession(){
  closeModal();
  const boxes=getBoxes();
  const masteredIds=[...(boxes.mastered||[])];
  if(!masteredIds.length){toast("No mastered words","var(--muted)");return;}
  const stars=getMasteredStars();
  // Sort: unquizzed first → fewest stars → least recently quizzed → shuffle ties
  const sorted=[...masteredIds].sort((a,b)=>{
    const sa=stars[a],sb=stars[b];
    if(!sa&&!sb)return Math.random()-.5;
    if(!sa)return-1;if(!sb)return 1;
    if(sa.stars!==sb.stars)return sa.stars-sb.stars;
    return(sa.lastQuizzed||0)-(sb.lastQuizzed||0);
  });
  const count=Math.min(_masteredModalCount||25,sorted.length);
  _masteredSess={
    queue:sorted.slice(0,count),
    queueIdx:0,flipped:false,
    direction:_masteredModalDir||"ar-en",
    correct:0,total:0,
    changes:{}
  };
  setView("mastered-review");
}

function renderMasteredReview(){
  if(!_masteredSess){setView("home");return renderHome();}
  const {queue,queueIdx,flipped,direction,correct,total}=_masteredSess;
  if(queueIdx>=queue.length)return renderMasteredSummary();
  const wordId=queue[queueIdx];
  const word=wordById(wordId);
  if(!word){_masteredSess.queueIdx++;render();return`<div style="padding:60px 0"></div>`;}
  const stars=getMasteredStars();
  const ws=stars[wordId];
  const starCount=ws?ws.stars:1;
  const starsHtml=Array.from({length:5},(_,i)=>
    `<span style="font-size:17px;color:${i<starCount?"#F5C518":"rgba(255,255,255,0.25)"}">${i<starCount?"★":"☆"}</span>`
  ).join("");
  const pct=(queueIdx/queue.length)*100;
  const arEn=direction==="ar-en";
  let formsHtml="";
  if(word.forms&&Object.keys(word.forms).length){
    formsHtml=`<div class="card-back-forms">`;
    Object.entries(word.forms).forEach(([lbl,val])=>{if(val)formsHtml+=`<div class="card-back-form"><div class="card-back-form-label">${lbl}</div><div class="card-back-form-val">${val}</div></div>`;});
    formsHtml+=`</div>`;
  }
  const frontHtml=arEn
    ?`<div style="font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px">What does this mean?</div>
       <div class="ar" style="font-size:54px;text-align:center;line-height:1.45">${word.arabic}</div>`
    :`<div style="font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px">How do you say this?</div>
       <div style="font-size:32px;font-weight:600;color:var(--sand);text-align:center;line-height:1.4">${word.english}</div>`;
  const backHtml=arEn
    ?`<div style="font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:10px;flex-shrink:0">Answer</div>
       <div class="card-back-english">${word.english}</div>
       ${word.example?`<div class="card-back-example">${word.example.split(" — ")[0]||""}</div><div class="card-back-example-en">${word.example.split(" — ")[1]||""}</div>`:""}${formsHtml}`
    :`<div style="font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:10px;flex-shrink:0">Answer</div>
       <div class="ar" style="font-size:48px;text-align:center;line-height:1.45;margin-bottom:10px">${word.arabic}</div>
       ${word.example?`<div class="card-back-example">${word.example.split(" — ")[0]||""}</div><div class="card-back-example-en">${word.example.split(" — ")[1]||""}</div>`:""}${formsHtml}`;
  return`
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <div class="prog-bar" style="flex:1"><div class="prog-fill" style="width:${pct.toFixed(1)}%;background:linear-gradient(90deg,var(--lm),var(--gold))"></div></div>
    <span style="font-size:11px;color:var(--muted);flex-shrink:0">${queueIdx+1}/${queue.length}</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:8px">${starsHtml}<span style="font-size:10px;color:var(--muted);margin-left:2px">${starCount}/5</span></div>
    <button class="end-btn" onclick="endMasteredSession()">■ End</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
    <span class="badge" style="background:rgba(95,211,160,0.12);color:var(--lm)">★ Mastered</span>
    <span class="badge" style="background:rgba(255,255,255,0.072);color:var(--muted)">${word.dialect||""}</span>
    <span class="badge" style="background:rgba(255,255,255,0.072);color:var(--muted)">${word.wordType||""}</span>
  </div>
  <div class="medina" data-key="m-${queueIdx}">
    <div class="m-world" data-mv="${queueIdx%3}"></div><div class="fx-layer"></div>
    <div class="hang"><div class="pend" style="animation-delay:-${(Date.now()/1000%7).toFixed(2)}s">
      <div class="rope"></div>
  <div class="flip-wrap" onclick="if(!${flipped})doMasteredFlip()">
    <div class="flip-inner${flipped?" flipped":""}">
      <div class="flip-face">${frontHtml}
      </div>
      <div class="flip-face flip-back">${backHtml}</div>
    </div>
  </div>
    </div></div>
    <div class="medina-actions">
  ${flipped?`<div class="rating-grid">
    <button class="rate-btn glass good" onclick="rateMasteredWord('correct')">✓ Got it <span style="font-size:10px;opacity:.5;font-weight:400">[J]</span></button>
    <button class="rate-btn glass bad" onclick="rateMasteredWord('incorrect')">✗ Missed <span style="font-size:10px;opacity:.5;font-weight:400">[K]</span></button>
  </div>`:`<div class="reveal-hint" onclick="doMasteredFlip()"><span class="hint-key">Press space to reveal the answer</span><span class="hint-tap">Tap the card to reveal the answer</span></div>`}
    </div>
  </div>
  <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--muted)">★ Mastered Review — words don't move unless demoted</div>`;
}

function doMasteredFlip(){if(!_masteredSess)return;_masteredSess.flipped=true;render();}

function _rateMasteredCore(rating){
  if(!_masteredSess)return;
  const wordId=_masteredSess.queue[_masteredSess.queueIdx];
  const stars=getMasteredStars();
  const ws=stars[wordId]||{stars:1,wrongAt0:0,lastQuizzed:0};
  const starsBefore=ws.stars;
  let newStars=ws.stars,newWrongAt0=ws.wrongAt0||0,demoted=false;
  if(rating==="correct"){
    newStars=Math.min(5,ws.stars+1);newWrongAt0=0;
  } else {
    if(ws.stars>0){newStars=ws.stars-1;newWrongAt0=0;}
    else{
      newWrongAt0=(ws.wrongAt0||0)+1;
      if(newWrongAt0>=2){
        demoted=true;
        removeWordFromBox(wordId,"mastered");addWordToBox(wordId,"l5b");
        delete stars[wordId];
        saveMasteredStars(stars);
        toast("Demoted back to L5B — needs more work","var(--red)");
      }
    }
  }
  if(!demoted){stars[wordId]={stars:newStars,wrongAt0:newWrongAt0,lastQuizzed:Date.now()};saveMasteredStars(stars);}
  _masteredSess.changes[wordId]={starsBefore,starsAfter:demoted?0:newStars,demoted};
  _masteredSess.total++;if(rating==="correct")_masteredSess.correct++;
  _masteredSess.queueIdx++;_masteredSess.flipped=false;render();
}

function endMasteredSession(){setView("mastered-summary");}

function renderMasteredSummary(){
  if(!_masteredSess)return renderHome();
  const {correct,total,changes}=_masteredSess;
  const pct=total>0?Math.round(correct/total*100):0;
  const starsGained=Object.values(changes).filter(c=>!c.demoted&&c.starsAfter>c.starsBefore).length;
  const demotedCount=Object.values(changes).filter(c=>c.demoted).length;
  const praise=pct>=90?"ممتاز":pct>=70?"أحسنت":"استمر";
  const statCols=[{v:total,l:"Reviewed",c:"var(--goldL)"},{v:correct,l:"Correct",c:"var(--green)"},{v:total-correct,l:"Missed",c:"var(--red)"},{v:`${pct}%`,l:"Accuracy",c:"var(--gold)"}];
  return`<div class="ar ruq" style="font-size:48px;text-align:center;color:var(--goldL);margin-bottom:4px">${praise}!</div>
  <div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:26px">★ Mastered Review complete</div>
  <div class="stat-grid" style="margin-bottom:22px">
    ${statCols.map(({v,l,c})=>`<div class="stat-box"><div style="font-size:26px;font-weight:700;color:${c}">${v}</div><div style="font-size:9px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em">${l}</div></div>`).join("")}
  </div>
  ${starsGained?`<div style="background:rgba(245,197,24,0.08);border:1px solid rgba(245,197,24,0.2);border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:var(--goldL)">★ ${starsGained} word${starsGained!==1?"s":""} gained a star</div>`:""}
  ${demotedCount?`<div style="background:rgba(240,122,122,0.07);border:1px solid rgba(240,122,122,0.2);border-radius:10px;padding:14px 16px;margin-bottom:14px">
    <div style="font-size:12px;color:var(--red);font-weight:700;margin-bottom:4px">⚠ ${demotedCount} word${demotedCount!==1?"s":""} demoted to L5B</div>
    <div style="font-size:12px;color:var(--muted)">They'll work their way back up through the regular SRS boxes.</div>
  </div>`:""}
  <div style="display:flex;gap:10px;margin-top:22px">
    <button class="btn1" onclick="_masteredSess=null;setView('home')">← Home</button>
    <button class="btn2" onclick="_masteredSess=null;openMasteredModal()">Go Again ★</button>
  </div><div class="ornament">✦</div>`;
}

// Space = flip card  |  J / 1 = Got it  |  K / 2 = Missed
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
  if(_view==='mastered-review'&&_masteredSess){
    if(e.key===' '||e.code==='Space'){e.preventDefault();if(!_masteredSess.flipped)doMasteredFlip();}
    else if((e.key==='j'||e.key==='J'||e.key==='1')&&_masteredSess.flipped){e.preventDefault();rateMasteredWord('correct');}
    else if((e.key==='k'||e.key==='K'||e.key==='2')&&_masteredSess.flipped){e.preventDefault();rateMasteredWord('incorrect');}
    return;
  }
  if(_view!=='review')return;
  const sess=getSession();
  if(!sess||!sess.active||sess.pendingPrompt)return;
  if(e.key===' '||e.code==='Space'){
    e.preventDefault();
    if(!sess.flipped)doFlip();
  }else if((e.key==='j'||e.key==='J'||e.key==='1')&&sess.flipped){
    e.preventDefault();rateWord('correct');
  }else if((e.key==='k'||e.key==='K'||e.key==='2')&&sess.flipped){
    e.preventDefault();rateWord('incorrect');
  }
});
