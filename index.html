<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مفرداتي · Mufradaati</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Philosopher:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#04140F;--bg2:#06201A;--bg3:#0A2A21;
  --card:rgba(13,50,39,0.58);--card2:rgba(22,78,62,0.42);--card3:rgba(32,100,80,0.42);
  --border:rgba(226,190,110,0.17);--border-hi:rgba(240,212,138,0.65);
  --gold:#D9B45E;--goldL:#F0D48A;--goldD:#8A6420;
  --sand:#EEE8D5;--muted:#8DB5A5;--muted2:#5E8677;
  --accent:#E6C36E;--green:#5FD3A0;--red:#F07A7A;--blue:#7FD6C8;--purple:#B7A6E8;
  --l1:#D9B45E;--l2:#D9B45E;--l3:#D9B45E;--l4:#D9B45E;--l5:#D9B45E;--lm:#F0D48A;
}
body{background:var(--bg);color:var(--sand);font-family:'Philosopher','Amiri',Georgia,serif;min-height:100vh;overflow-x:hidden;}
input,select,textarea,button{font-family:inherit;}
input::placeholder,textarea::placeholder{color:var(--muted2);}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:rgba(226,190,110,.28);border-radius:2px;}
select option{background:var(--card);color:var(--sand);}
.atmo{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 15% 10%,rgba(217,180,94,0.07) 0%,transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 85%,rgba(184,92,40,0.05) 0%,transparent 70%);}
.atmo::after{content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,0.022) 40px,rgba(255,255,255,0.022) 41px),
    repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,0.022) 40px,rgba(255,255,255,0.022) 41px);
  mask-image:radial-gradient(ellipse at 50% 50%,black 30%,transparent 80%);}
.shell{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 18px 90px;}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:28px;}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-ar{font-family:'Amiri',serif;font-size:28px;color:var(--goldL);direction:rtl;}
.brand-en{font-size:9px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:2px;}
.nav-btns{display:flex;gap:2px;}
.nav-btn{padding:6px 12px;border-radius:7px;border:none;cursor:pointer;font-size:12px;letter-spacing:.05em;background:transparent;color:var(--muted);transition:all .2s;}
.nav-btn:hover{color:var(--sand);}
.nav-btn.active{background:rgba(217,180,94,0.12);color:var(--goldL);border:1px solid rgba(217,180,94,0.2);}
.inp{width:100%;background:rgba(255,255,255,0.036);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--sand);font-size:15px;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--border-hi);}
.lbl{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px;}
.field{margin-bottom:18px;}
.btn1{background:linear-gradient(135deg,var(--goldD),var(--accent));color:#fff;border:none;border-radius:10px;padding:13px 26px;font-size:14px;cursor:pointer;font-weight:600;letter-spacing:.05em;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(196,96,42,0.2);transition:all .2s;}
.btn1:hover{opacity:.9;transform:translateY(-1px);}
.btn1:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
.btn2{background:transparent;color:var(--goldL);border:1px solid rgba(217,180,94,0.35);border-radius:10px;padding:11px 22px;font-size:13px;cursor:pointer;letter-spacing:.04em;transition:all .2s;}
.btn2:hover{border-color:var(--gold);background:rgba(217,180,94,0.06);}
.btn3{background:rgba(255,255,255,0.054);color:var(--sand);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;transition:all .2s;}
.btn3:hover{background:rgba(255,255,255,0.108);}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;}
.ar{font-family:'Amiri',serif;direction:rtl;color:var(--goldL);}
.s-head{font-size:10px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.s-head-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(217,180,94,0.25),transparent);}
.prog-bar{height:2px;background:rgba(255,255,255,0.108);border-radius:2px;}
.prog-fill{height:100%;border-radius:2px;transition:width .4s ease;background:linear-gradient(90deg,var(--gold),var(--accent));}
.flip-wrap{perspective:1400px;height:340px;margin-bottom:20px;cursor:pointer;}
.flip-inner{transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);height:100%;position:relative;}
.flip-inner.flipped{transform:rotateY(180deg);cursor:default;}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.flip-back{transform:rotateY(180deg);background:linear-gradient(145deg,var(--card),var(--card2));border-color:rgba(217,180,94,0.25);overflow-y:auto;justify-content:flex-start;padding-top:22px;}
.flip-face::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:3px;border-radius:0 0 40px 40px;background:linear-gradient(90deg,transparent,rgba(217,180,94,0.4),transparent);}
.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rate-btn{border-radius:12px;padding:14px 5px;cursor:pointer;text-align:center;border:1px solid;transition:all .15s;font-weight:700;font-family:inherit;font-size:15px;letter-spacing:.03em;}
.rate-btn:hover{transform:translateY(-2px);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);}
.modal{background:var(--card);border:1px solid rgba(217,180,94,0.2);border-radius:20px;padding:30px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;background:var(--card);border-radius:10px;padding:10px 20px;font-size:13px;letter-spacing:.04em;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.15);opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid var(--border);}
.toast.show{opacity:1;}
.badge{font-size:10px;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;letter-spacing:.04em;}
.tab-strip{display:flex;gap:5px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px;}
.tab-strip::-webkit-scrollbar{height:2px;}
.tab-btn{flex-shrink:0;border-radius:8px;border:1px solid var(--border);padding:6px 14px;cursor:pointer;font-size:12px;color:var(--muted);background:transparent;transition:all .2s;white-space:nowrap;}
.tab-btn:hover{color:var(--sand);}
.word-row{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 15px;display:flex;align-items:center;gap:13px;margin-bottom:7px;transition:border-color .2s;}
.word-row:hover{border-color:rgba(217,180,94,0.2);}
.box-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:14px;}
.box-card{border-radius:13px;padding:14px 11px;cursor:pointer;transition:all .15s;text-align:center;border:1.5px solid var(--border);background:var(--card);}
.box-card:hover{transform:translateY(-2px);}
.reserve-panel{grid-column:3;grid-row:1 / span 5;display:flex;flex-direction:column;gap:9px;}
.reserve-ctl{border:1.5px solid rgba(141,181,165,0.28);border-radius:13px;padding:14px 13px;background:rgba(141,181,165,0.04);}
.reserve-ctl .inp{padding:8px 10px;font-size:14px;}
.reserve-row{display:flex;gap:8px;align-items:center;}
.reserve-star{background:none;border:none;cursor:pointer;font-size:19px;line-height:1;padding:3px 6px;color:rgba(255,255,255,0.28);transition:color .15s;}
.reserve-star.on{color:var(--gold);}
.box-card.queue-box{border-style:dashed;opacity:.7;padding:10px 9px;cursor:default;}
.box-card.queue-box:hover{transform:none;}
.box-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:700;}
.box-count{font-size:28px;font-weight:700;line-height:1;}
.queue-label{font-size:8px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;font-weight:700;opacity:.8;}
.queue-count{font-size:21px;font-weight:700;line-height:1;}
.step-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);}
.step-row:last-child{border-bottom:none;}
.step-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.step-toggle{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s;}
.step-toggle.on{background:rgba(217,180,94,0.15);border-color:var(--gold);color:var(--goldL);}
.step-toggle.off{color:var(--muted2);}
.prompt-banner{background:rgba(217,180,94,0.07);border:1px solid rgba(217,180,94,0.28);border-radius:14px;padding:24px 20px;margin-bottom:18px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px 6px;text-align:center;}
.dialect-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.dialect-pill{border-radius:20px;border:1px solid var(--border);padding:5px 13px;font-size:11px;cursor:pointer;color:var(--muted);background:transparent;transition:all .2s;letter-spacing:.04em;}
.dialect-pill:hover{color:var(--sand);}
.dialect-pill.active{background:rgba(217,180,94,0.15);border-color:rgba(217,180,94,0.4);color:var(--goldL);}
.ornament{text-align:center;color:rgba(217,180,94,0.3);font-family:'Amiri',serif;font-size:20px;margin:20px 0;letter-spacing:8px;}
.end-btn{background:rgba(240,122,122,0.06);border:1px solid rgba(240,122,122,0.2);color:var(--red);border-radius:8px;cursor:pointer;font-size:12px;padding:5px 14px;letter-spacing:.04em;transition:all .2s;}
.end-btn:hover{background:rgba(240,122,122,0.12);}
.sub-tab-strip{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.sub-tab-btn{flex:1;padding:10px 6px;cursor:pointer;font-size:12px;color:var(--muted);background:transparent;border:none;border-right:1px solid var(--border);letter-spacing:.05em;transition:all .2s;text-align:center;}
.sub-tab-btn:last-child{border-right:none;}
.sub-tab-btn:hover{color:var(--sand);background:rgba(255,255,255,0.036);}
.sub-tab-btn.active{background:rgba(217,180,94,0.1);color:var(--goldL);font-weight:600;}
.preview-field{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.preview-ar{font-family:'Amiri',serif;direction:rtl;font-size:24px;color:var(--goldL);}
.preview-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(217,180,94,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.bulk-ta{width:100%;background:rgba(255,255,255,0.036);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--sand);font-size:14px;outline:none;resize:vertical;min-height:160px;line-height:1.8;transition:border-color .2s;}
.bulk-ta:focus{border-color:var(--border-hi);}
.bulk-result{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:5px;font-size:13px;}
.bulk-result.ok{background:rgba(95,211,160,0.07);border:1px solid rgba(95,211,160,0.18);}
.bulk-result.err{background:rgba(240,122,122,0.06);border:1px solid rgba(240,122,122,0.15);color:var(--muted);}
@media(max-width:480px){.box-grid,.stat-grid{grid-template-columns:1fr 1fr;}.reserve-panel{grid-column:1 / -1;grid-row:auto;}.rating-grid{grid-template-columns:1fr 1fr;}}
/* ── Bigger card back content ── */
.card-back-english{font-size:26px;font-weight:600;color:var(--sand);text-align:center;margin-bottom:10px;}
.card-back-example{font-family:'Amiri',serif;direction:rtl;font-size:22px;color:var(--goldL);text-align:center;line-height:1.6;margin-bottom:6px;}
.card-back-example-en{font-size:14px;color:var(--muted);font-style:italic;text-align:center;line-height:1.5;margin-bottom:12px;}
.card-back-forms{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;}
.card-back-form{text-align:center;background:rgba(217,180,94,0.08);border-radius:9px;padding:7px 12px;}
.card-back-form-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;}
.card-back-form-val{font-family:'Amiri',serif;direction:rtl;font-size:18px;color:var(--goldL);}
/* ── Apply tab ── */
.apply-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.apply-mode-btn{border-radius:13px;padding:18px 14px;cursor:pointer;text-align:center;border:1.5px solid var(--border);background:var(--card);transition:all .2s;}
.apply-mode-btn:hover{border-color:rgba(217,180,94,0.3);transform:translateY(-1px);}
.apply-mode-btn.active{background:rgba(217,180,94,0.08);border-color:rgba(217,180,94,0.45);}
.apply-mode-icon{font-size:26px;margin-bottom:8px;}
.apply-mode-label{font-size:13px;font-weight:600;color:var(--sand);margin-bottom:4px;}
.apply-mode-desc{font-size:11px;color:var(--muted);line-height:1.4;}
/* Generated text area */
.apply-text-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 20px;margin-bottom:16px;}
.apply-text{font-family:'Amiri',serif;direction:rtl;font-size:26px;line-height:2.2;color:var(--sand);text-align:right;}
.apply-text-en{font-size:14px;color:var(--muted);line-height:1.8;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
/* Word highlights */
.w-known{color:var(--goldL);cursor:default;}
.w-new{color:var(--blue);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;position:relative;}
.w-new:hover .w-tooltip{display:block;}
.w-tooltip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid rgba(127,214,200,0.3);border-radius:10px;padding:10px 14px;min-width:180px;max-width:240px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.12);text-align:center;}
.w-tooltip-meaning{font-family:'Philosopher',serif;font-size:14px;color:var(--sand);margin-bottom:8px;direction:ltr;}
.w-tooltip-btns{display:flex;gap:6px;justify-content:center;}
.w-tooltip-btn{font-size:10px;padding:4px 10px;border-radius:6px;border:1px solid;cursor:pointer;font-family:inherit;letter-spacing:.04em;white-space:nowrap;}
/* Grammar focus grid */
.grammar-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px;}
.grammar-btn{border-radius:9px;padding:9px 10px;cursor:pointer;text-align:center;border:1px solid var(--border);background:transparent;font-size:12px;color:var(--muted);transition:all .2s;line-height:1.3;}
.grammar-btn:hover{color:var(--sand);border-color:rgba(217,180,94,0.25);}
.grammar-btn.active{background:rgba(217,180,94,0.1);border-color:rgba(217,180,94,0.4);color:var(--goldL);font-weight:600;}
/* Sentence list for grammar mode */
.sentence-row{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:10px;}
.sentence-ar{font-family:'Amiri',serif;direction:rtl;font-size:24px;color:var(--sand);line-height:1.7;text-align:right;margin-bottom:6px;}
.sentence-en{font-size:13px;color:var(--muted);line-height:1.5;}

.box-card.queue-box{box-shadow:none;background:rgba(255,255,255,0.02);}
.box-label{letter-spacing:.18em;font-size:10px;}
.box-count{background:linear-gradient(180deg,#FFF6D2 5%,#EBCB85 50%,#B98A2E);-webkit-background-clip:text;background-clip:text;color:transparent!important;
  filter:drop-shadow(0 0 9px rgba(230,195,110,0.5));text-shadow:none;font-size:30px;}
.queue-count{text-shadow:0 0 14px rgba(230,195,110,0.35);}
.btn2,.btn3{background-color:rgba(4,22,16,0.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.btn1{background:linear-gradient(135deg,#B98A2E,#F0D48A);color:#06251B;box-shadow:0 4px 22px rgba(230,195,110,0.28);}
.btn1[style*="--red"]{color:#fff;}
.btn1:disabled{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border);opacity:1;box-shadow:none;}
.btn2{border-color:rgba(230,195,110,0.45);}
.brand-en{letter-spacing:.24em;}
.ar{text-shadow:0 0 14px rgba(230,195,110,0.16);}
.nav-btn.active,.dialect-pill.active{box-shadow:0 0 14px rgba(230,195,110,0.14);}
.prog-fill{background:linear-gradient(90deg,#B98A2E,#F0D48A);}
.ornament{color:rgba(230,195,110,0.55);text-shadow:0 0 12px rgba(230,195,110,0.3);}
/* lanterns */
@keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
@keyframes flick{0%,100%{opacity:1;}45%{opacity:.86;}55%{opacity:1;}70%{opacity:.93;}}
.hero-wrap{position:relative;}
.lantern{position:absolute;top:0;transform-origin:50% 0;animation:sway 5s ease-in-out infinite,flick 3.3s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,214,120,0.6));z-index:2;pointer-events:none;height:auto;}
.lantern.l-a{right:26px;width:32px;}
.lantern.l-b{right:72px;width:24px;animation-delay:-2s;}
.lantern.l-c{right:106px;width:17px;animation-delay:-3.4s;}
.hanger{position:fixed;top:0;z-index:0;pointer-events:none;display:none;flex-direction:column;align-items:center;transform-origin:50% 0;animation:sway 6.5s ease-in-out infinite;}
.hanger i{display:block;width:1px;height:var(--len);background:linear-gradient(rgba(230,195,110,0.15),rgba(230,195,110,0.85));}
.hanger svg{width:var(--w);height:calc(var(--w) * 2.27);margin-top:-2px;filter:drop-shadow(0 0 12px rgba(255,214,120,0.6));animation:flick 3.7s ease-in-out infinite;}
@media(min-width:1000px){.hanger{display:flex;}}
@media(max-width:520px){nav{gap:6px;}.nav-btn{padding:6px 7px;font-size:11px;}.brand-ar{font-size:26px;}}
@media(prefers-reduced-motion:reduce){.lantern,.hanger,.m-lan,.pend{animation:none!important;}}
/* ═══ the medina — flashcard scene ═══ */
.medina{position:relative;width:100vw;margin-left:calc(50% - 50vw);height:clamp(600px,calc(100vh - 190px),760px);margin-bottom:6px;overflow:hidden;}
.medina-bg{position:absolute;top:0;left:50%;margin-left:-533px;width:1066px;height:760px;max-width:none;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 13%,#000 87%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 6%,#000 100%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 13%,#000 87%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 6%,#000 100%);mask-composite:intersect;}
.m-lan{position:absolute;transform-origin:50% 0;animation:sway 5.5s ease-in-out infinite,flick 3.1s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,214,120,0.8));pointer-events:none;z-index:2;}
.hang{position:absolute;top:58px;left:0;right:0;display:flex;justify-content:center;z-index:3;pointer-events:none;}
.pend{width:min(272px,80vw);transform-origin:50% 0;animation:pend 7s ease-in-out infinite;pointer-events:auto;}
@keyframes pend{0%,100%{transform:rotate(-1.1deg);}50%{transform:rotate(1.1deg);}}
.rope{position:relative;width:5px;height:112px;margin:0 auto;border-radius:3px;background:repeating-linear-gradient(135deg,#F6DC96 0 3px,#8A6420 3px 6px);box-shadow:0 0 8px rgba(240,212,138,0.55);}
.rope::after{content:'';position:absolute;bottom:-6px;left:50%;width:16px;height:16px;margin-left:-8px;border:2.5px solid #F0D48A;border-radius:50%;background:#0A2A20;box-shadow:0 0 10px rgba(240,212,138,0.6);}
.flip-wrap{perspective:1400px;width:100%;height:368px;margin:0 auto;cursor:pointer;}
.flip-face{border-radius:136px 136px 24px 24px;padding:72px 24px 24px;background:linear-gradient(165deg,#12493A,#082219);border:2px solid rgba(240,212,138,0.75);
  box-shadow:0 0 34px rgba(230,195,110,0.28),0 14px 44px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,0.25);}
.flip-face::before{content:'';position:absolute;top:11px;left:50%;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:#F0D48A;border-radius:2px;box-shadow:0 0 10px rgba(240,212,138,0.8);height:11px;border-radius:2px;}
.flip-face::after{content:'';position:absolute;inset:9px;border:1px solid rgba(240,212,138,0.38);border-radius:127px 127px 16px 16px;pointer-events:none;}
.flip-back{background:linear-gradient(160deg,#175640,#0A2A20);overflow-y:auto;justify-content:flex-start;padding-top:76px;scrollbar-width:none;}
.flip-back::-webkit-scrollbar{display:none;}
.flip-face .ar{max-width:100%;overflow-wrap:anywhere;}
.card-back-english{font-size:23px;font-weight:400;margin-bottom:8px;}
.card-back-example{font-size:19px;line-height:1.7;max-width:100%;overflow-wrap:anywhere;text-wrap:balance;margin-bottom:4px;}
.card-back-example-en{font-size:12.5px;line-height:1.45;max-width:100%;overflow-wrap:anywhere;text-wrap:balance;margin-bottom:8px;}
.card-back-form{padding:5px 9px;}
.card-back-form-val{font-size:15px;}
.medina-actions{position:absolute;left:0;right:0;bottom:14px;padding:0 max(14px,calc(50% - 235px));z-index:4;}
.medina-actions .btn1{width:100%;}
.medina-actions .rate-btn{background-color:rgba(4,20,15,0.72)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:12px 5px;}
/* medina mode: no city skyline once you're inside the alley */
.skyline{transition:opacity .5s;}
body.medina-mode .skyline{opacity:0;}
body.medina-mode .hanger{display:none;}
/* ═══ pass 4 ═══ */
:root{--ms:1;--sky-top:#03110D;--sky-mid:#062219;--sky-low:#04160F;--sky-glow:0;--star-a:1;}
@media(max-width:999px){:root{--ms:.9;}}
@media(max-width:640px){:root{--ms:.78;}}
body{background:#03110D;}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 46%,var(--sky-low) 100%);}
.sky::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 85% 44% at 50% 100%,rgba(255,190,90,var(--sky-glow)),transparent 72%);}
#stars,#stars2{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:var(--star-a);}
#stars{animation:breathe 9s ease-in-out infinite;}
@keyframes breathe{0%,100%{filter:brightness(.9);}50%{filter:brightness(1.18);}}
.orb{position:fixed;z-index:0;pointer-events:none;width:96px;height:96px;margin:-48px 0 0 -48px;opacity:0;transition:opacity 1.5s;}
.orb.sun{border-radius:50%;background:radial-gradient(circle,#FFF6D2 0 30%,rgba(255,214,120,.6) 34%,rgba(255,190,90,0) 70%);}
.orb.moon svg{width:100%;height:100%;filter:drop-shadow(0 0 16px rgba(246,220,150,.75));}
/* medina: scale with viewport on small screens, walk-forward transition, answer feedback */
.medina{height:clamp(600px,calc(100vh - 190px),760px);}
.m-world{position:absolute;inset:0;transform:scale(var(--ms));transform-origin:50% 0;}
.hang{top:calc(58px * var(--ms));}
.rope{height:calc(112px * var(--ms));}
.m-enter .m-world{animation:stepin .62s cubic-bezier(.2,.7,.2,1);}
@keyframes stepin{from{transform:scale(calc(var(--ms) * 1.1));opacity:.7;}to{transform:scale(var(--ms));opacity:1;}}
.m-enter .pend{animation:drop .55s cubic-bezier(.2,.8,.3,1),pend 7s ease-in-out .55s infinite;}
@keyframes drop{from{transform:translateY(-36px);opacity:0;}to{transform:none;opacity:1;}}
.fx-layer{position:absolute;inset:0;pointer-events:none;z-index:6;}
.spark{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:radial-gradient(circle,#FFF6D2,#F0D48A 55%,transparent 72%);box-shadow:0 0 9px #F0D48A;animation:spark .95s ease-out forwards;}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3);}}
.fx-good .m-lan{animation:flare .74s ease-out!important;}
@keyframes flare{0%{filter:drop-shadow(0 0 8px rgba(255,214,120,.8));transform:scale(1);}35%{filter:drop-shadow(0 0 30px rgba(255,236,170,1)) brightness(1.55);transform:scale(1.14);}100%{filter:drop-shadow(0 0 8px rgba(255,214,120,.8));transform:scale(1);}}
.fx-good .pend{animation:lift .74s ease-in forwards!important;}
@keyframes lift{0%{transform:translateY(0);opacity:1;filter:brightness(1);}35%{filter:brightness(1.35);}100%{transform:translateY(-28px);opacity:0;}}
.fx-bad .m-lan{animation:dimflick .66s ease-out!important;}
@keyframes dimflick{0%{opacity:1;}15%{opacity:.25;}30%{opacity:.7;}45%{opacity:.2;}100%{opacity:.6;}}
.fx-bad .pend{animation:swingback .66s ease-out!important;}
@keyframes swingback{0%{transform:rotate(0);}22%{transform:rotate(-8deg);}50%{transform:rotate(5deg);}75%{transform:rotate(-2deg);}100%{transform:rotate(0);}}
.fx-bad .m-world{filter:brightness(.72);transition:filter .3s;}
@media(prefers-reduced-motion:reduce){.m-enter .m-world,.m-enter .pend{animation:none!important;}}
/* quiet controls: hint + glass outline ratings (no fills) */
.reveal-hint{text-align:center;font-size:13px;letter-spacing:.07em;color:rgba(240,212,138,.78);text-shadow:0 1px 10px #000,0 0 14px #000;cursor:pointer;padding:10px 6px;}
.hint-tap{display:none;}
@media(hover:none){.hint-key{display:none;}.hint-tap{display:inline;}}
.rating-grid{gap:12px;}
.rate-btn.glass{background:rgba(255,255,255,0.035)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.28)!important;color:var(--sand)!important;padding:10px 6px;font-size:14px;font-weight:400;border-radius:12px;box-shadow:none;}
.rate-btn.glass.good{border-color:rgba(95,211,160,0.55)!important;color:#A6EBCB!important;}
.rate-btn.glass.bad{border-color:rgba(240,122,122,0.5)!important;color:#F4A6A6!important;}
.rate-btn.glass:hover{background:rgba(255,255,255,0.08)!important;}
.medina-actions .rate-btn{background-color:transparent!important;padding:10px 6px;}
/* phone-only card sizing (laptop unchanged) */
@media(max-width:640px){
  .pend{width:min(304px,86vw);}
  .flip-wrap{height:400px;}
  .flip-face{border-radius:152px 152px 24px 24px;padding:80px 26px 26px;}
  .flip-face::after{border-radius:143px 143px 16px 16px;}
  .flip-back{padding-top:84px;}
  .card-back-english{font-size:25px;}
  .card-back-example{font-size:21px;}
  .card-back-example-en{font-size:13.5px;}
}
/* the bab (Start Session) */
.bab-card{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.bab-text{flex:1;min-width:0;align-self:center;padding-bottom:6px;}
.bab-cap{font-size:12px;letter-spacing:.07em;color:rgba(240,212,138,.85);margin-top:10px;}
.bab{width:150px;flex-shrink:0;cursor:pointer;margin:-4px -4px -12px 0;transition:transform .2s,filter .3s;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));-webkit-tap-highlight-color:transparent;}
.bab:hover{transform:translateY(-2px);}
.bab svg{display:block;width:100%;height:auto;overflow:visible;}
.bab-leaf{transition:transform .85s cubic-bezier(.5,0,.2,1);transform-box:fill-box;}
.bab-leaf.l{transform-origin:0% 50%;}
.bab-leaf.r{transform-origin:100% 50%;}
.bab:hover .bab-leaf.l{transform:scaleX(.95) skewY(-1.5deg);}
.bab:hover .bab-leaf.r{transform:scaleX(.95) skewY(1.5deg);}
.bab.ajar .bab-leaf.l{transform:scaleX(.5) skewY(-3deg);}
.bab.ajar .bab-leaf.r{transform:scaleX(.5) skewY(3deg);}
.bab.open .bab-leaf.l{transform:scaleX(.12) skewY(-5deg);}
.bab.open .bab-leaf.r{transform:scaleX(.12) skewY(5deg);}
.bab-glow{opacity:.3;transition:opacity .8s;}
.bab.open .bab-glow,.bab.ajar .bab-glow{opacity:1;}
.bab.shut{cursor:default;filter:grayscale(.6) brightness(.6);}
.bab.shut:hover{transform:none;}
.bab.shut:hover .bab-leaf{transform:none;}
.lantern.l-a{right:190px;}
.lantern.l-b{right:16px;}
.lantern.l-c{right:222px;}
@media(max-width:480px){.bab{width:118px;}.lantern.l-a{right:140px;}.lantern.l-c{right:170px;}}
/* fill-level vessel + summary lanterns */
.reserve-ctl{position:relative;}
.vessel{position:absolute;right:11px;top:9px;filter:drop-shadow(0 0 6px rgba(255,214,120,.4));}
.vessel.full{filter:drop-shadow(0 0 13px rgba(255,236,170,.95));}
.lan-row{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:-10px 0 6px;}
.lan-row svg{width:22px;height:50px;}
.lan-row .off{filter:grayscale(1) brightness(.4);opacity:.65;}
.lan-row .on{filter:drop-shadow(0 0 8px rgba(255,214,120,.85));animation:litup .55s ease-out both;}
@keyframes litup{from{filter:grayscale(1) brightness(.4);opacity:.5;}to{filter:drop-shadow(0 0 8px rgba(255,214,120,.85));opacity:1;}}
.lan-cap{text-align:center;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:22px;}

.reserve-ctl{background:rgba(4,26,20,0.6);}
.card{background:linear-gradient(160deg,rgba(16,62,50,0.78),rgba(7,32,25,0.76));}

const SESSION_QUEUE_FOR_BOX={l1:"l1q",l1q:"l1q",l2a:"l2a",l2b:"l2a",l3:"l3q",l3q:"l3q",l4:"l4q",l4q:"l4q",l5a:"l5a",l5b:"l5a",mastered:"mastered"};

// ═══════════════════════════════════════════════════════════
// PIN — namespaces all data per user
// ═══════════════════════════════════════════════════════════
function getPin(){return localStorage.getItem("muf-pin")||"";}
function savePin(p){localStorage.setItem("muf-pin",p);}
function pinKey(k){const p=getPin();return p?`${p}-${k}`:k;}
// ═══════════════════════════════════════════════════════════
// STORAGE — localStorage as cache, KV as source of truth
// ═══════════════════════════════════════════════════════════
function ls(k,d){try{const v=localStorage.getItem(pinKey(k));return v!==null?JSON.parse(v):d;}catch{return d;}}
function ss(k,v){try{localStorage.setItem(pinKey(k),JSON.stringify(v));}catch{}}
function getWords(){return ls("muf-words",[]);}
function getBoxes(){return ls("muf-boxes",{l1:[],l1q:[],l2a:[],l2b:[],l3q:[],l3:[],l4q:[],l4:[],l5a:[],l5b:[],mastered:[],reserve:[]});}
function getSettings(){return ls("muf-settings",{l1Target:40});}
function getStats(){return ls("muf-stats",{sessions:[],lifetime:{reviewed:0,correct:0,byLevel:{}}});}
function getSession(){return ls("muf-session",null);}
function saveSession(s){ss("muf-session",s);}
function clearSession(){localStorage.removeItem(pinKey("muf-session"));}
// ── KV sync helpers ──
let _syncT=null;
function setSyncStatus(msg,col){
  const el=document.getElementById("sync-indicator");
  if(!el)return;
  el.textContent=msg;el.style.color=col||"var(--muted)";el.style.opacity="1";
  clearTimeout(_syncT);_syncT=setTimeout(()=>{el.style.opacity="0";},2500);
}
async function kvSet(key,value){
  if(insideClaude())return;
  try{
    await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Action":"kv-set","X-Key":pinKey(key)},
      body:JSON.stringify(value)
    });
  }catch(e){}
}
async function kvGetAll(){
  if(insideClaude())return null;
  try{
    const r=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Action":"kv-getall","X-Pin":getPin()},
      body:"{}"
    });
    return await r.json();
  }catch(e){return null;}
}
// Save functions — write to localStorage immediately, sync to KV async
function saveWords(w){
  ss("muf-words",w);
  setSyncStatus("↑ syncing…","var(--muted)");
  kvSet("muf-words",w).then(()=>setSyncStatus("✓ synced","var(--green)")).catch(()=>setSyncStatus("⚠ sync failed","var(--gold)"));
}
function saveBoxes(b){ss("muf-boxes",b);kvSet("muf-boxes",b).catch(()=>{});}
function saveSettings(s){ss("muf-settings",s);kvSet("muf-settings",s).catch(()=>{});}
function saveStats(s){ss("muf-stats",s);kvSet("muf-stats",s).catch(()=>{});}

// ═══════════════════════════════════════════════════════════
// MIDNIGHT QUEUE CLEAR — runs once per calendar day on load
// Auto-clears ONLY L1Q→L1 each night.
// L3Q→L3 and L4Q→L4 release after their level's session step finishes (finishStep);
// L2A→L2B and L5A→L5B are prompt-only (in-session)
// ═══════════════════════════════════════════════════════════
function runMidnightClear(){
  const key="muf-last-clear";
  const today=new Date().toDateString();
  if(ls(key,null)===today)return;
  const sess=getSession();
  if(sess&&sess.active)return; // don't run during live session
  const boxes=getBoxes();let changed=false;
  [["l1q","l1"]].forEach(([from,to])=>{
    const ids=boxes[from]||[];
    if(ids.length){boxes[to]=[...(boxes[to]||[]),...ids];boxes[from]=[];changed=true;}
  });
  if(changed)saveBoxes(boxes);
  ss(key,today);
}

function uid(){return`w${Date.now()}${Math.random().toString(36).slice(2,5)}`;}
function todayDow(){return new Date().getDay();}
function hexRgb(hex){const h=hex.replace("#","");return`${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)}`;}
function sHead(t){return`<div class="s-head">${t}<div class="s-head-line"></div></div>`;}
function wordById(id){return getWords().find(w=>w.id===id);}
function boxDef(id){return BOXES.find(b=>b.id===id)||{id,label:id,color:"#888",isQueue:false,main:1};}
function moveWords(ids,fromBox,toBox){const b=getBoxes();const set=new Set(ids);b[fromBox]=(b[fromBox]||[]).filter(id=>!set.has(id));b[toBox]=[...(b[toBox]||[]),...ids];saveBoxes(b);}
function addWordToBox(wordId,box){const b=getBoxes();if(!b[box])b[box]=[];if(!b[box].includes(wordId))b[box].push(wordId);saveBoxes(b);}
function removeWordFromBox(wordId,box){const b=getBoxes();b[box]=(b[box]||[]).filter(id=>id!==wordId);saveBoxes(b);}
let _toastT;
function toast(msg,col){col=col||"var(--green)";clearTimeout(_toastT);const el=document.getElementById("toast");el.textContent=msg;el.style.borderColor=col;el.style.color=col;el.classList.add("show");_toastT=setTimeout(()=>el.classList.remove("show"),2800);}
function sessionDoneToday(){const stats=getStats();const today=new Date().toDateString();return stats.sessions.some(s=>new Date(s.ts).toDateString()===today);}

// ═══════════════════════════════════════════════════════════
// ROUTING LOGIC
// ═══════════════════════════════════════════════════════════
function correctDest(box,dow){
  if(box==="l5b")return"mastered";if(box==="l4")return"l5a";if(box==="l3")return"l4";
  if(box==="l2b")return L3Q_DAYS.includes(dow)?"l3q":"l3";if(box==="l1")return"l2a";return"l1";
}
function incorrectDest(box){
  if(box==="l5b")return"l4q";if(box==="l4")return"l3q";if(box==="l3")return"l2a";
  if(box==="l2b")return"l1q";if(box==="l1")return"l1q";return"l1q";
}

  _view=v;
  ["home","boxes","add","apply","stats"].forEach(k=>{
    const el=document.getElementById("nb-"+k);if(!el)return;
    el.classList.toggle("active",k===v||(k==="home"&&["home","summary","review"].includes(v)));
  });
  render();
}
function goHome(){setView("home");}
function render(){
  const m=document.getElementById("main");if(!m)return;
  if(_view==="home")m.innerHTML=renderHome();
  else if(_view==="boxes")m.innerHTML=renderBoxes();
  else if(_view==="add")m.innerHTML=renderAdd();
  else if(_view==="apply")m.innerHTML=renderApply();
  else if(_view==="stats")m.innerHTML=renderStats();
  else if(_view==="review")m.innerHTML=renderReview();
  else if(_view==="summary")m.innerHTML=renderSummary();

  hydrateMedina();refreshStars();
}

// ── sky follows the clock; stars = mastered words ──
const SKY_KEYS=[
 [0,[3,17,13],[6,34,25],[4,22,15],0,1],
 [4.6,[3,17,13],[6,34,25],[4,22,15],0,1],
 [5.7,[8,34,44],[20,80,74],[170,125,54],.5,.55],
 [7.4,[8,44,50],[16,76,70],[52,104,86],.3,.22],
 [12,[8,46,52],[18,84,76],[46,100,84],.12,.18],
 [16.6,[8,44,50],[16,76,70],[66,104,80],.28,.2],
 [18.3,[8,32,42],[34,74,60],[200,128,54],.6,.5],
 [19.7,[5,26,28],[10,46,40],[110,76,40],.3,.9],
 [21.2,[3,17,13],[6,34,25],[4,22,15],0,1],
 [24,[3,17,13],[6,34,25],[4,22,15],0,1]];
function _lerp(a,b,t){return a+(b-a)*t;}
function skyAt(h){
  let i=0;while(i<SKY_KEYS.length-2&&h>=SKY_KEYS[i+1][0])i++;
  const a=SKY_KEYS[i],b=SKY_KEYS[i+1];const t=Math.max(0,Math.min(1,(h-a[0])/(b[0]-a[0])));
  const mix=(x,y)=>x.map((v,k)=>Math.round(_lerp(v,y[k],t)));
  return{top:mix(a[1],b[1]),mid:mix(a[2],b[2]),low:mix(a[3],b[3]),glow:_lerp(a[4],b[4],t),stars:_lerp(a[5],b[5],t)};
}
function _orbPlace(el,h,start,end){
  if(!el)return;
  if(h<start||h>end){el.style.opacity=0;return;}
  const p=(h-start)/(end-start);
  el.style.left=(6+88*p)+"%";el.style.top=(66-46*Math.sin(Math.PI*p))+"%";el.style.opacity=1;
}
function applySky(){
  const d=new Date();const h=d.getHours()+d.getMinutes()/60;
  const s=skyAt(h);const r=document.documentElement.style;
  r.setProperty("--sky-top","rgb("+s.top+")");r.setProperty("--sky-mid","rgb("+s.mid+")");r.setProperty("--sky-low","rgb("+s.low+")");
  r.setProperty("--sky-glow",s.glow.toFixed(2));r.setProperty("--star-a",Math.max(.2,s.stars).toFixed(2));
  _orbPlace(document.getElementById("sun"),h,5.6,18.4);
  _orbPlace(document.getElementById("moon"),h<5.6?h+24:h,18.4,29.6);
}
let _starN=-1,_starW=0,_starH=0,_twink=[];
function _seeded(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}
function refreshStars(force){
  const c=document.getElementById("stars"),c2=document.getElementById("stars2");if(!c||!c2)return;
  const n=Math.min(1500,(getBoxes().mastered||[]).length);const w=innerWidth,h=innerHeight;
  if(!force&&n===_starN&&w===_starW&&h===_starH)return;
  _starN=n;_starW=w;_starH=h;_twink=[];
  const dpr=Math.min(2,window.devicePixelRatio||1);
  [c,c2].forEach(cv=>{cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);});
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const rnd=_seeded(1337);
  for(let i=0;i<n;i++){
    const x=rnd()*w,y=Math.pow(rnd(),1.3)*h*.8,r=.5+Math.pow(rnd(),3)*1.6,a=.35+rnd()*.65,gold=rnd()<.35;
    g.globalAlpha=a;g.fillStyle=gold?"#F6DC96":"#DFF6EE";g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();
    if(r>1.6){g.globalAlpha=a*.5;g.fillRect(x-r*2.2,y-.4,r*4.4,.8);g.fillRect(x-.4,y-r*2.2,.8,r*4.4);}
    if(i%14===0)_twink.push([x,y,r,gold]);
  }
}
function twinkle(){
  const c=document.getElementById("stars2");if(!c||!_twink.length)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);const g=c.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,_starW,_starH);
  _twink.forEach(([x,y,r,gold])=>{
    if(Math.random()<.55)return;
    g.globalAlpha=.25+Math.random()*.7;g.fillStyle=gold?"#FFF0BE":"#FFFFFF";
    g.beginPath();g.arc(x,y,r*1.5+.6,0,6.2832);g.fill();
    g.globalAlpha*=.6;g.fillRect(x-r*3,y-.5,r*6,1);g.fillRect(x-.5,y-r*3,1,r*6);
  });
}
setTimeout(()=>{applySky();refreshStars(true);setInterval(applySky,300000);setInterval(twinkle,650);
  let _rs;addEventListener("resize",()=>{clearTimeout(_rs);_rs=setTimeout(()=>refreshStars(true),200);});},0);

// ── medina scenes: parsed once, cloned per card ──
const _mCache={};let _mKey=null;
function hydrateMedina(){
  document.querySelectorAll(".m-world[data-mv]").forEach(el=>{
    const k=+el.dataset.mv;
    if(!_mCache[k]){const t=document.createElement("template");t.innerHTML=MEDINA[k];_mCache[k]=t.content;}
    el.appendChild(_mCache[k].cloneNode(true));el.removeAttribute("data-mv");
  });
  const med=document.querySelector(".medina");
  if(!med){_mKey=null;return;}
  if(med.dataset.key!==_mKey){_mKey=med.dataset.key;med.classList.add("m-enter");setTimeout(()=>med.classList.remove("m-enter"),1300);}
}

// ── answer feedback: lanterns flare (right) or gutter (missed), card lifts or swings back ──
let _fxBusy=false;
function spawnSparks(med){
  const layer=med.querySelector(".fx-layer");if(!layer)return;
  const mr=med.getBoundingClientRect();
  med.querySelectorAll(".m-lan").forEach(l=>{
    const r=l.getBoundingClientRect();if(r.width<8)return;
    const cx=r.left+r.width/2-mr.left,cy=r.top+r.height*.55-mr.top;
    const n=Math.max(2,Math.round(r.width/9));
    for(let i=0;i<n;i++){
      const s=document.createElement("i");s.className="spark";s.style.left=cx+"px";s.style.top=cy+"px";

function renderBoxGrid(){
  const boxes=getBoxes();const words=getWords();
  const dm={};words.forEach(w=>{dm[w.id]=w.dialect;});
  function cnt(id){const ids=boxes[id]||[];return _dialectFilter==="All"?ids.length:ids.filter(id=>dm[id]===_dialectFilter).length;}
  const layout=[{id:"l1q",q:true},{id:"l1",q:false},{id:"l2a",q:false},{id:"l2b",q:false},{id:"l3q",q:true},{id:"l3",q:false},{id:"l4q",q:true},{id:"l4",q:false},{id:"l5a",q:false},{id:"l5b",q:false}];
  let h=`<div class="box-grid">`;
  for(const item of layout){
    if(!item){h+=`<div></div>`;continue;}
    const def=boxDef(item.id);const c=def.color;const rg=hexRgb(c);const n=cnt(item.id);
    h+=item.q
      ?`<div class="box-card queue-box" style="border-color:rgba(${rg},0.4)"><div class="queue-label" style="color:${c}">${def.label}</div><div class="queue-count" style="color:${c}">${n}</div></div>`
      :(()=>{
        if(item.id==="mastered"&&n>0){
          const mStars=getMasteredStars();const mastIds=boxes["mastered"]||[];
          const fiveStars=mastIds.filter(id=>mStars[id]&&mStars[id].stars>=5).length;
          const starBar=fiveStars>0?`<div style="font-size:9px;color:var(--lm);margin-top:3px">★${fiveStars} perfect</div>`:"";
          return`<div class="box-card" onclick="viewBox('mastered')" style="background:rgba(${rg},0.04);border-color:rgba(${rg},0.25)"><div class="box-label" style="color:${c}">Mastered</div><div class="box-count" style="color:${c}">${n}</div>${starBar}</div>`;
        }
        return`<div class="box-card" onclick="viewBox('${item.id}')" style="background:rgba(${rg},0.04);border-color:rgba(${rg},0.25)"><div class="box-label" style="color:${c}">${def.label}</div><div class="box-count" style="color:${c}">${n}</div></div>`;
      })()
  }
  // Mastered lives in the right-hand column, under the Reserves controls
  const mdef=boxDef("mastered");const mc=mdef.color;const mrg=hexRgb(mc);const mn=cnt("mastered");
  const mStars=getMasteredStars();const mastIds=boxes["mastered"]||[];
  const fiveStars=mastIds.filter(id=>mStars[id]&&mStars[id].stars>=5).length;
  const starBar=fiveStars>0?`<div style="font-size:9px;color:var(--lm);margin-top:3px">★${fiveStars} perfect</div>`:"";
  const masteredTile=`<div class="box-card" onclick="viewBox('mastered')" style="background:rgba(${mrg},0.04);border-color:rgba(${mrg},0.25)"><div class="box-label" style="color:${mc}">Mastered</div><div class="box-count" style="color:${mc}">${mn}</div>${starBar}</div>`;
  return h+renderReservePanel(cnt("reserve"),masteredTile)+`</div>`;
}

// RESERVES — parked words, never quizzed, moved out only by hand or Fill
// ═══════════════════════════════════════════════════════════
let _lastFill=null;
function l1InPlay(b){b=b||getBoxes();return (b.l1||[]).length+(b.l1q||[]).length;}
// Fill order: starred first, then oldest added
function reservePickOrder(){
  const b=getBoxes();const wm={};getWords().forEach(w=>{wm[w.id]=w;});
  return (b.reserve||[]).map((id,i)=>({id,i})).filter(x=>wm[x.id]).sort((a,c)=>{
    const pa=wm[a.id].priority?1:0,pc=wm[c.id].priority?1:0;
    if(pa!==pc)return pc-pa;
    const ta=wm[a.id].createdAt||0,tc=wm[c.id].createdAt||0;
    return ta!==tc?ta-tc:a.i-c.i;
  }).map(x=>x.id);
}
function renderReservePanel(shownCount,extraHtml){
  const b=getBoxes();const def=boxDef("reserve");const c=def.color;const rg=hexRgb(c);
  const total=(b.reserve||[]).length;const wm={};getWords().forEach(w=>{wm[w.id]=w;});
  const starred=(b.reserve||[]).filter(id=>wm[id]&&wm[id].priority).length;
  const target=getSettings().l1Target||40;const inPlay=l1InPlay(b);const need=Math.max(0,target-inPlay);
  const fillLabel=total===0?"Reserves empty":need===0?"L1 at target":`Fill Level 1 · ${Math.min(need,total)}`;
  const undo=_lastFill&&_lastFill.length?`<button class="btn3" style="width:100%;margin-top:8px;font-size:11px;padding:7px" onclick="undoLastFill()">↶ Undo last move (${_lastFill.length})</button>`:"";
  return`<div class="reserve-panel">
    <div class="box-card" onclick="viewBox('reserve')" style="background:rgba(${rg},0.05);border-color:rgba(${rg},0.3)">
      <div class="box-label" style="color:${c}">Reserves</div><div class="box-count" style="color:${c}">${shownCount}</div>
      ${starred?`<div style="font-size:9px;color:var(--gold);margin-top:3px">★${starred} first in line</div>`:""}
    </div>
    <div class="reserve-ctl">
      ${vesselHtml(inPlay,target)}
      <label class="lbl" style="margin-bottom:5px">L1 Target</label>
      <div class="reserve-row"><input id="rs-target" class="inp" type="number" min="1" max="500" value="${target}" onchange="saveReserveTarget(this.value)" style="max-width:80px"/><span style="font-size:11px;color:var(--muted2)">words</span></div>
      <div style="font-size:11px;color:var(--muted);margin:8px 0 10px;line-height:1.5">L1 + Queue: <span style="color:var(--sand)">${inPlay}</span> of ${target}</div>
      <button class="btn1" style="width:100%;justify-content:center;padding:11px 10px;font-size:13px" ${total===0||need===0?"disabled":""} onclick="askFillReserve('target')">${fillLabel}</button>
      <div style="height:1px;background:var(--border);margin:14px 0 12px"></div>
      <label class="lbl" style="margin-bottom:5px">Add a number</label>
      <div class="reserve-row"><input id="rs-n" class="inp" type="number" min="1" placeholder="#" style="max-width:80px"/><button class="btn2" style="flex:1;padding:9px 10px" ${total===0?"disabled":""} onclick="askFillReserve('manual')">Add to L1</button></div>
      ${undo}
    </div>
    ${extraHtml||""}
  </div>`;
}
function saveReserveTarget(v){const n=Math.max(1,Math.min(500,parseInt(v)||40));const s=getSettings();s.l1Target=n;saveSettings(s);toast("Target saved");render();}
function askFillReserve(mode){
  const b=getBoxes();const total=(b.reserve||[]).length;const inPlay=l1InPlay(b);const target=getSettings().l1Target||40;
  let n;
  if(mode==="target"){n=Math.min(Math.max(0,target-inPlay),total);}
  else{n=parseInt(document.getElementById("rs-n")?.value);if(!n||n<1){toast("Enter how many to add","var(--gold)");return;}n=Math.min(n,total);}
  if(n<1){toast(total===0?"Reserves is empty":"L1 is already at target","var(--gold)");return;}
  const order=reservePickOrder().slice(0,n);const wm={};getWords().forEach(w=>{wm[w.id]=w;});
  const nStar=order.filter(id=>wm[id]&&wm[id].priority).length;
  const after=inPlay+n;
  document.getElementById("modal-root").innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="text-align:center">
        <div style="font-size:17px;font-weight:700;color:var(--sand);margin-bottom:10px">Move ${n} word${n!==1?"s":""} to Level 1?</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.6">From Reserves → Level 1<br>L1 + Queue: ${inPlay} → <strong style="color:var(--sand)">${after}</strong> (target ${target})</div>
        ${nStar?`<div style="font-size:11px;color:var(--gold);margin-bottom:6px">★ ${nStar} starred word${nStar!==1?"s":""} included</div>`:""}
        ${mode==="manual"&&after>target?`<div style="font-size:11px;color:var(--muted2);margin-bottom:6px">This goes ${after-target} over your target.</div>`:""}
        <div style="display:flex;gap:10px;justify-content:center;margin-top:20px">
          <button class="btn1" onclick="closeModal();doFillReserve(${n})">Move ${n}</button>
          <button class="btn3" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>`;
}
function doFillReserve(n){
  const ids=reservePickOrder().slice(0,n);if(!ids.length)return;
  moveWords(ids,"reserve","l1");_lastFill=ids;
  toast(`Moved ${ids.length} to Level 1 ✓`);render();
}
function undoLastFill(){
  const b=getBoxes();const ids=(_lastFill||[]).filter(id=>(b.l1||[]).includes(id));
  if(ids.length)moveWords(ids,"l1","reserve");
  _lastFill=null;toast(`Returned ${ids.length} to Reserves`);render();
}
function toggleReserveStar(id){
  const words=getWords();const w=words.find(x=>x.id===id);if(!w)return;
  w.priority=!w.priority;saveWords(words);render();
}

function toggleSessionBox(box){_sessionToggles[box]=!_sessionToggles[box];renderSessionModal();}
function closeModal(){document.getElementById("modal-root").innerHTML="";}
function startSession(){
  const dow=_sessionModalCtx.dow;closeModal();
  const boxes=getBoxes();const order=["l5b","l4","l3","l2b","l1"];
  const enabled=order.filter(b=>_sessionToggles[b]&&(boxes[b]||[]).length>0);
  if(!enabled.length){toast("No words in selected boxes","var(--red)");return;}
  const steps=enabled.map(b=>({box:b,done:false,correct:0,incorrect:0}));
  saveSession({active:true,dow,steps,stepIdx:0,queue:[...(boxes[steps[0].box]||[])],queueIdx:0,flipped:false,ratings:{},pendingPrompt:null,startedAt:Date.now(),moveLog:[],sessionCorrect:0,sessionTotal:0,byLevel:{},cardDirection:_sessionModalCtx.cardDirection||"ar-en"});

}

function renderReview(){
  const sess=getSession();
  if(!sess||!sess.active){setView("home");return renderHome();}
  if(sess.pendingPrompt)return renderPrompt(sess);
  const step=sess.steps[sess.stepIdx];
  if(!step||step.done||sess.queueIdx>=sess.queue.length){setTimeout(()=>finishStep(),0);return`<div style="text-align:center;padding:60px 0;color:var(--muted)">Loading…</div>`;}
  const wordId=sess.queue[sess.queueIdx];const word=wordById(wordId);
  if(!word){sess.queueIdx++;saveSession(sess);setTimeout(()=>render(),0);return`<div style="padding:60px 0"></div>`;}
  const def=boxDef(step.box);const c=def.color;const rg=hexRgb(c);
  const pctStep=sess.queue.length>0?(sess.queueIdx/sess.queue.length)*100:0;
  const doneSteps=sess.steps.filter(s=>s.done).length;
  const overallPct=((doneSteps+(pctStep/100))/sess.steps.length)*100;
  // Extra forms for back of card
  let formsHtml="";
  if(word.forms&&Object.keys(word.forms).length>0){
    formsHtml=`<div class="card-back-forms">`;
    Object.entries(word.forms).forEach(([label,val])=>{
      if(!val)return;
      formsHtml+=`<div class="card-back-form">
        <div class="card-back-form-label">${label}</div>
        <div class="card-back-form-val">${val}</div>

    ?`<div style="font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px">What does this mean?</div>

      <div style="font-size:32px;font-weight:600;color:var(--sand);text-align:center;line-height:1.4">${word.english}</div>`;

    ?`<div style="font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:10px;flex-shrink:0">Answer</div>
      <div class="card-back-english">${word.english}</div>
      ${word.example?`<div class="card-back-example">${word.example.split(" — ")[0]||""}</div>
      <div class="card-back-example-en">${word.example.split(" — ")[1]||""}</div>`:""}
      ${formsHtml}`
    :`<div style="font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:10px;flex-shrink:0">Answer</div>
      <div class="ar" style="font-size:48px;text-align:center;line-height:1.45;margin-bottom:10px">${word.arabic}</div>
      ${word.example?`<div class="card-back-example">${word.example.split(" — ")[0]||""}</div>
      <div class="card-back-example-en">${word.example.split(" — ")[1]||""}</div>`:""}
      ${formsHtml}`;

  return`
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <div class="prog-bar" style="flex:1"><div class="prog-fill" style="width:${overallPct.toFixed(1)}%"></div></div>
    <span style="font-size:11px;color:var(--muted);flex-shrink:0">${sess.queueIdx+1}/${sess.queue.length}</span>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
    <button class="end-btn" onclick="confirmEndSession()">■ End Session</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
    <span class="badge" style="background:rgba(${rg},0.12);color:${c}">${def.label}</span>
    <span class="badge" style="background:rgba(255,255,255,0.072);color:var(--muted)">${word.dialect||""}</span>
    <span class="badge" style="background:rgba(255,255,255,0.072);color:var(--muted)">${word.wordType||""}</span>
  </div>
  <div class="medina" data-key="${sess.stepIdx}-${sess.queueIdx}">
    <div class="m-world" data-mv="${(sess.queueIdx+sess.stepIdx*2)%3}"></div><div class="fx-layer"></div>
    <div class="hang"><div class="pend" style="animation-delay:-${(Date.now()/1000%7).toFixed(2)}s">
      <div class="rope"></div>

    </div></div>

    <button class="rate-btn glass good" onclick="rateWord('correct')">✓ Got it <span style="font-size:10px;opacity:.5;font-weight:400">[J]</span></button>
    <button class="rate-btn glass bad" onclick="rateWord('incorrect')">✗ Missed <span style="font-size:10px;opacity:.5;font-weight:400">[K]</span></button>
  </div>`:`<div class="reveal-hint" onclick="doFlip()"><span class="hint-key">Press space to reveal the answer</span><span class="hint-tap">Tap the card to reveal the answer</span></div>`}
  ${!sess.flipped&&_undoState?`<div style="text-align:center;margin-top:10px"><button onclick="undoLastCard()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;letter-spacing:.04em;text-decoration:underline;text-underline-offset:2px;">↩ Undo last card</button></div>`:""}
    </div>
  </div>`;
}
function doFlip(){const sess=getSession();if(!sess)return;sess.flipped=true;saveSession(sess);render();}
let _undoState=null;
function _rateWordCore(rating){
  const sess=getSession();if(!sess||!sess.active)return;
  const step=sess.steps[sess.stepIdx];const wordId=sess.queue[sess.queueIdx];
  const dest=rating==="correct"?correctDest(step.box,sess.dow):incorrectDest(step.box);
  _undoState={wordId,from:step.box,to:dest,queueIdx:sess.queueIdx,
    sessionCorrect:sess.sessionCorrect,sessionTotal:sess.sessionTotal,
    byLevel:JSON.parse(JSON.stringify(sess.byLevel||{})),
    stepCorrect:step.correct,stepIncorrect:step.incorrect};
  removeWordFromBox(wordId,step.box);addWordToBox(wordId,dest);
  sess.ratings[wordId]=rating;sess.moveLog.push({wordId,from:step.box,to:dest});
  if(rating==="correct")step.correct++;else step.incorrect++;
  sess.sessionTotal++;if(rating==="correct")sess.sessionCorrect++;
  if(!sess.byLevel[step.box])sess.byLevel[step.box]={correct:0,total:0};
  sess.byLevel[step.box].total++;if(rating==="correct")sess.byLevel[step.box].correct++;
  sess.queueIdx++;sess.flipped=false;saveSession(sess);render();
}
function undoLastCard(){
  if(!_undoState)return;
  const u=_undoState;_undoState=null;
  const sess=getSession();if(!sess||!sess.active)return;
  const step=sess.steps[sess.stepIdx];
  removeWordFromBox(u.wordId,u.to);addWordToBox(u.wordId,u.from);
  sess.queueIdx=u.queueIdx;sess.sessionCorrect=u.sessionCorrect;sess.sessionTotal=u.sessionTotal;
  sess.byLevel=u.byLevel;step.correct=u.stepCorrect;step.incorrect=u.stepIncorrect;
  if(sess.moveLog.length>0)sess.moveLog.pop();
  delete sess.ratings[u.wordId];
  sess.flipped=true;saveSession(sess);render();
  toast("Card undone — re-rate it","var(--gold)");
}

// STEP FLOW
// ═══════════════════════════════════════════════════════════
function finishStep(){
  const sess=getSession();if(!sess)return;
  sess.steps[sess.stepIdx].done=true;const box=sess.steps[sess.stepIdx].box;

  if(box==="l5b"){
    const f=getBoxes();if((f.l5a||[]).length>0){
      sess.pendingPrompt={type:"move",from:"l5a",to:"l5b",msg:"Move L5A → L5B?",sub:"Words in L5A have waited their week and are ready to become L5B candidates."};
      saveSession(sess);render();return;
    }
  }
  if(box==="l4"){
    const f=getBoxes();if((f.l4q||[]).length>0){moveWords([...f.l4q],"l4q","l4");toast("L4 Queue → L4 ✓","var(--blue)");}
  }
  if(box==="l3"){
    const f=getBoxes();if((f.l3q||[]).length>0){moveWords([...f.l3q],"l3q","l3");toast("L3 Queue → L3 ✓","var(--gold)");}
  }
  if(box==="l2b"){
    const f=getBoxes();if((f.l2a||[]).length>0){
      sess.pendingPrompt={type:"move",from:"l2a",to:"l2b",msg:"Move L2A → L2B?",sub:"These words have waited 2 days and are ready to be reviewed in tomorrow's L2B session."};
      saveSession(sess);render();return;
    }
  }
  if(box==="l1"){
    const f=getBoxes();if((f.l1q||[]).length>0){moveWords([...f.l1q],"l1q","l1");}
    endSession(sess);return;
  }
  advanceStep(sess);
}
function advanceStep(sess){
  if(!sess)sess=getSession();if(!sess)return;
  sess.stepIdx++;
  if(sess.stepIdx>=sess.steps.length){endSession(sess);return;}
  const nextBox=sess.steps[sess.stepIdx].box;
  sess.queue=[...(getBoxes()[nextBox]||[])];sess.queueIdx=0;sess.flipped=false;
  saveSession(sess);render();
}
function renderPrompt(sess){
  const p=sess.pendingPrompt;const fd=boxDef(p.from);const td=boxDef(p.to);
  const cnt=(getBoxes()[p.from]||[]).length;
  return`<div style="min-height:320px;display:flex;flex-direction:column;justify-content:center">
    <div class="prompt-banner" style="text-align:center">
      <div style="font-size:32px;margin-bottom:14px">🔄</div>
      <div style="font-size:18px;font-weight:700;color:var(--goldL);margin-bottom:10px">${p.msg}</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6">${p.sub}</div>
      <div style="font-size:14px;color:var(--sand);margin-bottom:22px">
        <span style="color:${fd.color}">${fd.label}</span>
        <span style="color:var(--muted);margin:0 10px">→</span>
        <span style="color:${td.color}">${td.label}</span>
        <span style="color:var(--muted);margin-left:8px">(${cnt} word${cnt!==1?"s":""})</span>
      </div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn1" onclick="confirmPrompt(true)">Yes, move them</button>
        <button class="btn3" onclick="confirmPrompt(false)">Skip for now</button>
      </div>
    </div>
  </div>`;
}
function confirmPrompt(yes){
  const sess=getSession();if(!sess)return;const p=sess.pendingPrompt;
  if(yes){const b=getBoxes();moveWords([...(b[p.from]||[])],p.from,p.to);toast(`${boxDef(p.from).label} → ${boxDef(p.to).label} ✓`);}
  sess.pendingPrompt=null;saveSession(sess);advanceStep(sess);
}
function endSession(sess){
  const stats=getStats();const dow=sess.dow;
  stats.lifetime.reviewed=(stats.lifetime.reviewed||0)+sess.sessionTotal;
  stats.lifetime.correct=(stats.lifetime.correct||0)+sess.sessionCorrect;
  Object.keys(sess.byLevel||{}).forEach(box=>{
    if(!stats.lifetime.byLevel[box])stats.lifetime.byLevel[box]={correct:0,total:0};
    stats.lifetime.byLevel[box].correct+=sess.byLevel[box].correct;stats.lifetime.byLevel[box].total+=sess.byLevel[box].total;
  });
  stats.sessions.push({ts:Date.now(),dow,correct:sess.sessionCorrect,total:sess.sessionTotal,byLevel:sess.byLevel,moveLog:sess.moveLog});
  if(stats.sessions.length>300)stats.sessions=stats.sessions.slice(-300);
  saveStats(stats);
  saveSession({...sess,active:false,endedAt:Date.now()});
  setView("summary");
}
function confirmEndSession(){
  document.getElementById("modal-root").innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="text-align:center">
        <div style="font-size:28px;margin-bottom:14px">■</div>
        <div style="font-size:17px;font-weight:700;color:var(--sand);margin-bottom:10px">End session early?</div>

        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn1" onclick="closeModal();endSession(getSession())">Yes, end it</button>
          <button class="btn3" onclick="closeModal()">Keep going</button>
        </div>
      </div>

}

async function generateQuickAdd(){
  const en=document.getElementById("qa-en")?.value?.trim()||"";
  const dial=document.getElementById("qa-dial")?.value||_qaState.dialect;
  const wtype=document.getElementById("qa-type")?.value||_qaState.wordType;
  if(!en){toast("Enter an English word first","var(--red)");return;}
  _qaState={..._qaState,dialect:dial,wordType:wtype,loading:true,error:null,preview:null};render();
  let typeInstr="";
  if(wtype==="Verb")typeInstr=`Include extraFields: "Past (هو)", "Present (هو)", "Masdar", "Imperative (أنت)".`;
  else if(wtype==="Noun")typeInstr=`Include extraFields: "Singular", "Plural" (broken plural if one exists).`;
  else if(wtype==="Adjective")typeInstr=`Include extraFields: "Masculine", "Feminine", "Plural" (broken plural if one exists).`;
  else typeInstr=`extraFields can be empty {}.`;
  const dialectNote={MSA:"Modern Standard Arabic",Darija:"Moroccan Darija",Shaami:"Levantine Arabic",Egyptian:"Egyptian Arabic",Iraqi:"Iraqi Arabic",Gulf:"Gulf Arabic",Universal:"MSA (note if pronunciation varies by dialect)",Other:"Arabic"};
  const prompt=`You are an expert Arabic linguist specializing in all dialects. Generate a vocabulary flashcard.

English: "${en}"
Dialect: ${dialect_note(dial)}
Word Type: ${wtype}

Rules:
- Use FULL Arabic diacritics (tashkeel) on EVERY Arabic word, no exceptions.
- "arabic" = the main/primary form.
- ${typeInstr}
- Generate one natural example sentence in ${dial} using this word, with full diacritics.
- Include English translation of the example.

Respond ONLY with valid JSON (no markdown, no explanation):
{"arabic":"","english":"${en}","extraFields":{},"exampleAr":"","exampleEn":""}`;

  function dialect_note(d){return({MSA:"Modern Standard Arabic",Darija:"Moroccan Darija",Shaami:"Levantine Arabic",Egyptian:"Egyptian Arabic",Iraqi:"Iraqi Arabic",Gulf:"Gulf Arabic",Universal:"MSA",Other:"Arabic"})[d]||d;}

  try{
    const r=await fetch(apiUrl(),{method:"POST",headers:apiHeaders(),
      body:JSON.stringify({model:"claude-sonnet-4-5-20250929",max_tokens:800,messages:[{role:"user",content:prompt}]})});
    const data=await r.json();const raw=data.content?.find(c=>c.type==="text")?.text||"";
    const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
    _qaState={..._qaState,loading:false,preview:{...parsed,wordType:wtype,dialect:dial}};
  }catch(e){_qaState={..._qaState,loading:false,error:"Generation failed — check your connection and try again."};}
  render();
}
function dialect_note(d){return({MSA:"Modern Standard Arabic",Darija:"Moroccan Darija",Shaami:"Levantine Arabic",Egyptian:"Egyptian Arabic",Iraqi:"Iraqi Arabic",Gulf:"Gulf Arabic",Universal:"MSA",Other:"Arabic"})[d]||d;}
function saveQA(){
  const p=_qaState.preview;if(!p)return;
  const arabic=document.getElementById("qa-ar")?.innerText?.trim()||p.arabic;
  const english=document.getElementById("qa-en-prev")?.innerText?.trim()||p.english;
  if(!arabic||!english){toast("Arabic and English required","var(--red)");return;}
  const exAr=document.getElementById("qa-ex-ar")?.innerText?.trim()||"";
  const exEn=document.getElementById("qa-ex-en")?.innerText?.trim()||"";
  const example=exAr?(exEn?`${exAr} — ${exEn}`:exAr):"";
  const fieldKeys=Object.keys(p.extraFields||{});
  const editedForms={};
  fieldKeys.forEach((label,i)=>{const val=document.getElementById(`qa-ef-${i}`)?.innerText?.trim()||"";if(val)editedForms[label]=val;});
  const word={id:uid(),arabic,english,example,wordType:p.wordType||"Noun",dialect:p.dialect||"MSA",forms:editedForms,createdAt:Date.now()};
  saveWords([...getWords(),word]);
  const sess=getSession();const sa=sess&&sess.active;
  const tb=sa?(SESSION_QUEUE_FOR_BOX[sess.steps[sess.stepIdx]?.box||"l1"]||"l1q"):(_qaState.targetBox||"l1q");
  addWordToBox(word.id,tb);toast(`"${english}" added to ${boxDef(tb).label} ✓`);

Respond ONLY with this exact JSON — no markdown, no explanation:
{"arabic":"base form with full diacritics","english":"meaning","wordType":"Verb or Noun or Adjective or Other","extraFields":{},"exampleAr":"example sentence with full diacritics","exampleEn":"english translation"}`;
  try{

    const data=await r.json();const raw=data.content?.find(c=>c.type==="text")?.text||"";
    const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
    _qaState={..._qaState,loading:false,preview:{...parsed,dialect:dial}};
  }catch(e){_qaState={..._qaState,loading:false,error:"Generation failed — check your API key and connection."};}
  render();
}

async function runBulkAdd(){
  const raw=document.getElementById("bulk-ta")?.value||"";
  const lines=raw.split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length){toast("Enter at least one word","var(--red)");return;}
  const mode=_bulkState.mode||"english";
  _bulkState={..._bulkState,loading:true,results:null};render();
  const results=[];
  for(const line of lines){
    const parts=line.split(",").map(p=>p.trim());
    const mainInput=parts[0]||"";
    const dialectRaw=parts[1]||"MSA";
    const dialect=DIALECTS.find(d=>d.toLowerCase()===dialectRaw.toLowerCase())||"MSA";
    if(!mainInput){results.push({input:line,error:"Could not parse",removed:false,expanded:false});continue;}
    const prompt=mode==="arabic"
      ?`You are an expert Arabic linguist. The input below may be in ANY form (conjugated verb, bound/construct noun, inflected adjective, etc.).
Your tasks:
1. Identify the BASE FORM (lemma/dictionary citation form) with FULL diacritics (tashkeel) on every letter — no exceptions.
2. Determine the word type: Verb, Noun, Adjective, Phrase, or Other.
3. Provide the primary English meaning (concise, 1–6 words).
4. Generate the appropriate grammatical forms with full diacritics:
   - Verb → extraFields MUST have exactly: "Past (هو)", "Present (هو)", "Masdar", "Imperative (أنت)".
   - Noun → extraFields MUST have exactly: "Singular", "Plural" (broken plural if one exists, otherwise sound plural).
   - Adjective → extraFields MUST have exactly: "Masculine", "Feminine", "Plural" (broken plural if exists).
   - Otherwise: extraFields = {}.
5. Compose one short natural example sentence in ${dialect_note(dialect)} using the word, with full diacritics, plus its English translation.

Input word: "${mainInput}"
Assumed dialect: ${dialect_note(dialect)}

Respond ONLY with this exact JSON structure, no markdown:
{"arabic":"base form with full diacritics","english":"meaning","wordType":"Verb or Noun or Adjective or Phrase or Other","extraFields":{"all keys filled as instructed"},"exampleAr":"sentence with diacritics","exampleEn":"english translation"}`
      :`You are an expert Arabic linguist. Generate a vocabulary flashcard.
English: "${mainInput}"
Dialect: ${dialect_note(dialect)}
Detect word type. Use FULL diacritics on ALL Arabic text.

If Verb: extraFields MUST have exactly these 4 keys with non-empty values: "Past (هو)" (3rd person masc singular past), "Present (هو)" (3rd person masc singular present/mudari), "Masdar" (verbal noun), "Imperative (أنت)" (2nd person masc singular command).
If Noun: extraFields MUST have exactly these 2 keys: "Singular", "Plural" (use broken plural if it exists, otherwise sound plural).
If Adjective: extraFields MUST have exactly these 3 keys: "Masculine", "Feminine", "Plural" (broken plural if exists).
Otherwise: extraFields = {}.

Also provide one short natural example sentence in ${dialect_note(dialect)} with full diacritics, plus its English translation.

Respond ONLY with this exact JSON structure, no markdown:
{"arabic":"main form with diacritics","english":"${mainInput}","wordType":"Verb or Noun or Adjective or Phrase or Other","extraFields":{"all keys filled as instructed"},"exampleAr":"sentence with diacritics","exampleEn":"english translation"}`;
    try{
      const r=await fetch(apiUrl(),{method:"POST",headers:apiHeaders(),
        body:JSON.stringify({model:"claude-sonnet-4-5-20250929",max_tokens:600,messages:[{role:"user",content:prompt}]})});
      const data=await r.json();const raw2=data.content?.find(c=>c.type==="text")?.text||"";
      const p=JSON.parse(raw2.replace(/```json|```/g,"").trim());
      const ex=p.exampleAr?(p.exampleEn?`${p.exampleAr} — ${p.exampleEn}`:p.exampleAr):"";
      const word={id:uid(),arabic:p.arabic,english:p.english||(mode==="arabic"?"":mainInput),example:ex,wordType:p.wordType||"Other",dialect,forms:p.extraFields||{},createdAt:Date.now()};
      // Don't save yet — user reviews first
      results.push({word,input:line,error:null,removed:false,expanded:false});
    }catch(e){results.push({input:line,error:"Generation failed",removed:false,expanded:false});}
  }
  _bulkState={..._bulkState,loading:false,results};render();
}

function exportData(){
  const keys=["muf-words","muf-boxes","muf-settings","muf-stats","muf-session","muf-last-clear"];
  const snapshot={exportedAt:new Date().toISOString(),version:1};
  // Always read from pinned keys (where data actually lives with PIN system)
  keys.forEach(k=>{const v=localStorage.getItem(pinKey(k));if(v!==null)snapshot[k]=JSON.parse(v);});
  const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`mufradaati-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast("Backup downloaded ✓");
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const snapshot=JSON.parse(e.target.result);
      // Accept both namespaced ({pin}-muf-words) and plain (muf-words) backups
      const pin=getPin();
      const hasNamespaced=snapshot[`${pin}-muf-words`]||snapshot[`${pin}-muf-boxes`];
      const hasPlain=snapshot["muf-words"]||snapshot["muf-boxes"];
      if(!hasNamespaced&&!hasPlain){toast("Invalid backup file","var(--red)");return;}
      const wordCount=((hasNamespaced?(snapshot[`${pin}-muf-words`]||[]):(snapshot["muf-words"]||[]))).length;
      const dateStr=snapshot.exportedAt?new Date(snapshot.exportedAt).toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"}):"this file";
      document.getElementById("modal-root").innerHTML=`
        <div class="modal-overlay">
          <div class="modal" style="text-align:center">
            <div style="font-size:17px;font-weight:700;color:var(--sand);margin-bottom:10px">Import backup?</div>
            <div style="font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.6">Backup from <strong>${dateStr}</strong> — <strong>${wordCount}</strong> word${wordCount!==1?"s":""}.</div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.6">This will replace ALL current data. This cannot be undone.</div>

function _importConfirmed(){
  const snap=window._pendingImport;if(!snap)return;
  const pin=getPin();
  const dataKeys=["muf-words","muf-boxes","muf-settings","muf-stats","muf-session","muf-last-clear"];
  dataKeys.forEach(k=>{
    // Try namespaced key first (backups made with PIN), fall back to plain key (old backups)
    const val=snap[`${pin}-${k}`]!==undefined?snap[`${pin}-${k}`]:snap[k];
    if(val!==undefined)ss(k,val);

const IMPORT_WORDS_FORMAT="mufradaati-import-v1";
function stripDiacritics(s){return(s||"").replace(/[ً-ْٰـ]/g,"").trim();}
function importDialectLabel(d){
  const v=(d||"").trim().toLowerCase();
  if(v==="shaami")return"Shaami";
  if(v==="darija")return"Darija";
  return"MSA"; // fusha, both, or unrecognized all land on MSA (this app's name for Fusha)
}
function importPosLabel(p){
  const v=(p||"").trim().toLowerCase();
  if(v==="noun")return"Noun";
  if(v==="verb")return"Verb";
  if(v==="adjective")return"Adjective";
  return"Other";
}
// Raw import entry → card object. Caller has already checked ar/en are non-empty.
function mapImportEntry(raw){
  const arabic=(raw.ar||"").trim();const english=(raw.en||"").trim();
  const dialect=importDialectLabel(raw.dialect);
  const forms={};
  if((raw.plural||"").trim())forms["Plural"]=raw.plural.trim();
  if((raw.verbForm||"").trim())forms["Form"]=raw.verbForm.trim();
  if((raw.present||"").trim())forms["Present"]=raw.present.trim();
  if((raw.feminine||"").trim())forms["Feminine"]=raw.feminine.trim();
  if((raw.adjPlural||"").trim())forms[forms["Plural"]?"Plural (adj.)":"Plural"]=raw.adjPlural.trim();
  if((raw.dialect||"").trim().toLowerCase()==="both")forms["Also"]="Shaami";
  if((raw.levantine||"").trim())forms["Shaami equivalent"]=raw.levantine.trim();
  if((raw.source||"").trim())forms["Source"]=raw.source.trim();
  let createdAt=Date.now();
  const addedStr=(raw.added||"").trim();
  if(addedStr){const t=Date.parse(addedStr);if(!isNaN(t))createdAt=t;}
  return{id:uid(),arabic,english,example:(raw.example||"").trim(),wordType:importPosLabel(raw.pos),dialect,forms,createdAt};
}

    <div style="font-size:13px;color:var(--sand)">Imported <strong style="color:var(--green)">${r.imported}</strong>, skipped <strong style="color:var(--gold)">${r.duplicates.length}</strong> duplicate${r.duplicates.length!==1?"s":""}, <strong style="color:var(--red)">${r.invalid.length}</strong> invalid.</div>
    ${dupList}${invList}
  </div>`;
}
function runWordImport(){
  const ta=document.getElementById("import-words-ta");
  const raw=ta?ta.value:(_importWordsState.text||"");
  _importWordsState.text=raw;
  let parsed;
  try{parsed=JSON.parse(raw);}
  catch(e){_importWordsState={..._importWordsState,error:"That isn't valid JSON — check for a missing bracket, quote, or trailing comma.",result:null};renderImportWordsModal();return;}

  let list;
  if(Array.isArray(parsed)){
    list=parsed;
  }else if(parsed&&typeof parsed==="object"&&Array.isArray(parsed.words)){
    if(parsed.format!==IMPORT_WORDS_FORMAT){
      _importWordsState={..._importWordsState,error:`Unrecognized format "${parsed.format||"(none)"}" — expected "${IMPORT_WORDS_FORMAT}".`,result:null};
      renderImportWordsModal();return;
    }
    list=parsed.words;
  }else{
    _importWordsState={..._importWordsState,error:`Expected a "words" array (${IMPORT_WORDS_FORMAT}) or a bare array of word objects.`,result:null};
    renderImportWordsModal();return;
  }
  if(!list.length){
    _importWordsState={..._importWordsState,error:"No words found in that JSON.",result:null};
    renderImportWordsModal();return;
  }

  // Dedupe against words already in the app, by Arabic (diacritics/tatweel stripped) + mapped dialect
  const existingWords=getWords();
  const seen=new Set(existingWords.map(w=>stripDiacritics(w.arabic)+"|"+w.dialect));
  const toAdd=[];const duplicates=[];const invalid=[];
  list.forEach((entry,i)=>{
    if(!entry||typeof entry!=="object"){invalid.push({index:i,reason:"Not a word object"});return;}
    const arRaw=(entry.ar||"").trim();const enRaw=(entry.en||"").trim();
    if(!arRaw||!enRaw){
      invalid.push({index:i,ar:arRaw,en:enRaw,reason:!arRaw&&!enRaw?"Missing \"ar\" and \"en\"":!arRaw?"Missing \"ar\"":"Missing \"en\""});
      return;
    }
    const word=mapImportEntry(entry);
    const key=stripDiacritics(word.arabic)+"|"+word.dialect;
    if(seen.has(key)){duplicates.push({ar:word.arabic,en:word.english,dialect:word.dialect});return;}
    seen.add(key); // also catches duplicates within this same pasted batch
    toAdd.push(word);
  });

  if(toAdd.length){
    const sess=getSession();const sa=sess&&sess.active;
    const tb=sa?(SESSION_QUEUE_FOR_BOX[sess.steps[sess.stepIdx]?.box||"l1"]||"l1q"):"reserve";
    const boxes=getBoxes();if(!boxes[tb])boxes[tb]=[];
    toAdd.forEach(w=>{if(!boxes[tb].includes(w.id))boxes[tb].push(w.id);});
    saveWords([...existingWords,...toAdd]);  // one write for the whole batch
    saveBoxes(boxes);                        // one write for the whole batch
    toast(`Imported ${toAdd.length} word${toAdd.length!==1?"s":""} to ${boxDef(tb).label} ✓`);
  }

  _importWordsState={..._importWordsState,error:null,result:{imported:toAdd.length,duplicates,invalid}};
  renderImportWordsModal();
}
